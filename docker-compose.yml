# Cinetra — ambiente de desenvolvimento 100% em container.
# Sobe: db (Postgres) + api (Phoenix/Ash) + web (SvelteKit BFF).
#   docker compose up
# Nada roda local — mix e npm executam dentro dos serviços.

# Nome de projeto EXPLÍCITO. Sem ele o compose herda o nome do DIRETÓRIO (`moving`), que é o nome
# antigo do produto — os containers saíam como `moving-api-1` e a marca (Cinetra) não batia com a
# infra. Fixar aqui também desacopla os nomes do caminho onde o repositório foi clonado.
#
# **Precisa ser diferente do projeto de observabilidade** (`cinetra-obs`): o agente de log coleta
# por allowlist de projeto, e a regex do relabel é ANCORADA — `cinetra` casa só com `cinetra`,
# nunca com `cinetra-obs`. É isso que impede o Loki de coletar a si mesmo.
name: cinetra

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cinetra_dev
    ports:
      # Host port 5434 (5432/5433 já usados por outros stacks) -> Postgres do container.
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
      dockerfile: Dockerfile.dev
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Usuário privilegiado (dono): roda migrations/DDL, bypassa RLS.
      DATABASE_HOST: db
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: cinetra_dev
      # Role restrito do app (NOSUPERUSER/NOBYPASSRLS): o phx.server conecta como ele
      # e fica sujeito às RLS policies (ADR-018).
      DATABASE_APP_USER: cinetra_app
      DATABASE_APP_PASSWORD: cinetra_app
      PORT: "4000"
      # Google OAuth (ADR-015) — valores vêm do .env (gitignored), não daqui.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # BASE do redirect (ADR-005/015): o AshAuthentication anexa "/user/google/callback".
      # Aponta para o WEB (BFF), não para a API. Deve casar com o que está no console do Google.
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:5173/auth}
      # Cloudflare R2 — anexos do paciente (doc 51, ADR-008). Segredo: vem do .env (gitignored).
      # Sem estas quatro, a API sobe normalmente e só a fatia de anexos responde 503.
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      # Comunicação com o paciente (doc 52). Segredo: vem do .env (gitignored). Sem a chave, o
      # e-mail cai na caixa em memória de /dev/mailbox e a fatia funciona igual em dev.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_WEBHOOK_SECRET: ${RESEND_WEBHOOK_SECRET:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Cinetra}
      # WhatsApp (doc 65, fase 2). São **duas** chaves em série, e as duas precisam chegar aqui:
      # a flag diz que DEVE falar WhatsApp, as credenciais dizem que PODE
      # (`Api.Messaging.Transport.disponivel?/1` exige as duas).
      #
      # As quatro da Zernio faltavam neste arquivo — só a flag era repassada. O efeito era o pior
      # tipo de silêncio: `WHATSAPP_HABILITADO=true` no `.env`, o container recriado, e toda
      # mensagem continuando a sair por e-mail sem erro nenhum, porque o adapter sem credencial
      # deixa o canal indisponível e o `Dispatch` cai para a reserva — exatamente como deve.
      # `compose.dokploy.yml` já as repassava; o dev ficou para trás quando a fase 2 entrou.
      WHATSAPP_HABILITADO: ${WHATSAPP_HABILITADO:-false}
      ZERNIO_API_KEY: ${ZERNIO_API_KEY:-}
      ZERNIO_ACCOUNT_ID: ${ZERNIO_ACCOUNT_ID:-}
      ZERNIO_BASE_URL: ${ZERNIO_BASE_URL:-}
      ZERNIO_WEBHOOK_SECRET: ${ZERNIO_WEBHOOK_SECRET:-}
      # ---- Traces (doc 76) --------------------------------------------------------------------
      #
      # VAZIO por padrão: sem endpoint o exportador é `:none` e os spans morrem em memória — dev
      # sem stack de observabilidade continua igual. Para ligar, no `.env` da raiz:
      #
      #     OTEL_EXPORTER_OTLP_ENDPOINT_API=http://alloy:4317
      #
      # O destino é o Alloy (não o Tempo): é lá que a poda de atributos mora, valendo para os dois
      # serviços de uma vez. Só resolve com o stack `cinetra-obs` de pé.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT_API:-}
      # Lidas pelo próprio SDK (padrão OpenTelemetry), em vez de reimplementadas em Elixir — assim
      # o rótulo do serviço é definido do mesmo jeito aqui e no BFF em Node.
      OTEL_SERVICE_NAME: cinetra-api
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=dev
    ports:
      # Host 4010 (4000 já usado por outro stack) -> Phoenix do container.
      - "4010:4000"
    volumes:
      - ./api:/app
      - api_deps:/app/deps
      - api_build:/app/_build
      # Raiz do repositório, SÓ LEITURA, só para `Api.DeployEnvTest`: ele cobra que o compose de
      # produção passe as envs que o `runtime.exs` lê, e o compose mora fora de `api/`. No CI a
      # suíte roda em `api/` com o checkout inteiro ao lado (`../compose.dokploy.yml`); aqui não
      # havia como enxergá-lo, e o teste ficaria pulando em silêncio no único lugar onde se
      # desenvolve. É um DIRETÓRIO de propósito: bind mount de arquivo único no WSL congela um
      # snapshot, e o teste passaria a ler uma versão velha do compose sem avisar.
      - ./:/repo:ro
    stdin_open: true
    tty: true

  web:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    depends_on:
      - api
    environment:
      # Endereço da API server-to-server (BFF -> Phoenix), pela rede do compose.
      API_URL: http://api:4000
      # Endereço da API **pelo browser**. Só o WebSocket da agenda e o redirect do OAuth usam:
      # são as duas exceções ao ADR-005 (o resto do tráfego passa pelo BFF). É `localhost:4010`
      # porque quem disca é o navegador do host, não um container — `http://api:4000` não
      # resolve fora da rede do compose.
      API_PUBLIC_ORIGIN: http://localhost:4010
      # Terceira exceção ao ADR-005 (doc 51): o `PUT` do anexo vai direto ao bucket do R2, então
      # a origem dele precisa entrar no `connect-src` da CSP. Aqui é o id PÚBLICO da conta — o
      # bucket segue privado, e o acesso é sempre por URL assinada.
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      # ---- Traces (doc 76) --------------------------------------------------------------------
      #
      # VAZIO por padrão: sem o stack de observabilidade rodando, o `otel.mjs` é no-op e o BFF fica
      # exatamente como era. Para ligar, ponha no `.env` da raiz:
      #
      #     OTEL_EXPORTER_OTLP_ENDPOINT_WEB=http://alloy:4318
      #
      # Porta 4318 (OTLP/HTTP) aqui, contra 4317 (gRPC) da API — cada SDK tem o caminho batido pela
      # sua comunidade, e o Alloy escuta os dois. Só resolve com o stack `cinetra-obs` de pé, que é
      # quem põe o `alloy` nesta rede.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT_WEB:-}
      OTEL_SERVICE_NAME: cinetra-web
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=dev
      # `--import` ANTES da aplicação: é o que permite instrumentar `http` e `undici` trocando o
      # módulo por baixo de quem os importa. Carregado depois, o SDK sobe e não intercepta nada.
      # Caminho absoluto de propósito — em `NODE_OPTIONS` o relativo depende do cwd do processo.
      NODE_OPTIONS: --import /app/otel.mjs
    ports:
      - "5173:5173"
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    stdin_open: true
    tty: true

volumes:
  pgdata:
  api_deps:
  api_build:
  web_node_modules:
