# DEPLOY no Dokploy (Oracle Cloud A1 / VPS, ARM ou x86) — deploy de produção E de HML.
# Diferente do compose.prod.yml (só SMOKE LOCAL), este é o que o Dokploy consome no modo "Compose".
# Runbook completo: docs/59-deploy-dokploy-oci.md. Teste local do roteamento: compose.bff-test.yml.
#
# UM arquivo, DOIS stacks no Dokploy (mesmo host):
#   - PROD  (branch main):     WEB_HOST=cinetra.com.br      STACK=prod
#   - HML   (branch develop):  WEB_HOST=hml.cinetra.com.br  STACK=hml
# HML é IDÊNTICO a prod (mesmo build, mesmo migrate); só muda o que vem por env.
#
# BFF-ONLY (Option B, docs/59 §3.1): UM domínio só (WEB_HOST). A API **não tem host público
# próprio** — o subdomínio api.* foi removido. Só dois paths de WEB_HOST chegam na API pelo Traefik:
#   /socket    -> WebSocket (o único caminho que o browser toca direto na API)
#   /webhooks  -> provedores externos (Resend hoje; genérico p/ os próximos)
# Todo o resto de WEB_HOST vai para o web (BFF), que fala com a API por http interno. As rotas da
# API têm prioridade maior que o catch-all do web, senão /socket cairia no web.
#
# COMO O DOKPLOY USA ISTO
#   - Os ${VAR} são injetados pelo Dokploy (aba Environment de cada stack) — NUNCA comite segredo.
#   - HML tem SEUS segredos, SEU banco e SEU bucket R2. Nunca aponte HML p/ dado de produção (LGPD).
#   - ${STACK} deixa os nomes de router/service do Traefik únicos entre os dois stacks.
#
# ISOLAMENTO DE REDE (só a API fala com o banco)
#   - `data` : db + migrate + api. O `web` NÃO entra — não alcança o banco nem por TCP.
#   - `app`  : web <-> api (http://api:4000).
#   - `dokploy-network` (externa): Traefik -> api (só /socket e /webhooks) e web.
#
# ORDEM: db (healthy) -> backup (pré-deploy) -> migrate -> api + web.
#
# BACKUP (docs/59 §13, deploy/backup/): `backup` roda 1x ANTES do migrate (fail-closed);
# `backup-cron` a cada 1h. Bucket R2 PRÓPRIO, separado do de anexos; cifra age opcional.

# Rotação do log local (docs/62 §7.4). O default do Docker é `json-file` **sem limite**: o arquivo
# cresce até o disco acabar, e no A1 do docs/59 disco é o recurso escasso (risco #5 de lá).
#
# Isto vale mesmo com o Alloy embarcando os logs para o Loki — é o PISO, não a alternativa. Se o
# agente morrer, parar de embarcar não pode virar encher o disco da máquina que serve os pacientes.
# 3 arquivos × 20 MB = 60 MB por container no pior caso.
x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

# Env compartilhada dos serviços de backup (âncora YAML).
x-backup-env: &backup-env
  PGHOST: db
  PGUSER: postgres
  PGPASSWORD: ${POSTGRES_PASSWORD}
  PGDATABASE: ${POSTGRES_DB}
  STACK: ${STACK}
  BACKUP_BUCKET: ${BACKUP_BUCKET}
  HOURLY_RETENTION: ${BACKUP_HOURLY_RETENTION:-48h}
  DAILY_RETENTION: ${BACKUP_DAILY_RETENTION:-30d}
  BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
  # Heartbeat do backup (docs/62 §9). O monitor EXTERNO reclama quando o sinal não chega — é o que
  # fecha o buraco que o docs/59 §13 nomeou: o cron de 1h morre com `set -e` e código != 0 sem que
  # ninguém saiba. `HEARTBEAT_BASE_URL` é a MESMA raiz que a API usa (uma por ambiente); o slug
  # `backup` é acrescentado pelo script. Vazio = desligado.
  HEARTBEAT_BASE_URL: ${HEARTBEAT_BASE_URL:-}
  HEARTBEAT_SLUG_PREFIX: ${HEARTBEAT_SLUG_PREFIX:-}
  HEARTBEAT_URL_BACKUP: ${HEARTBEAT_URL_BACKUP:-}
  RCLONE_CONFIG_R2_TYPE: s3
  RCLONE_CONFIG_R2_PROVIDER: Cloudflare
  RCLONE_CONFIG_R2_ENDPOINT: https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com
  RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${BACKUP_R2_ACCESS_KEY_ID}
  RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${BACKUP_R2_SECRET_ACCESS_KEY}
  RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"

services:
  db:
    image: postgres:16
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backup:
    build:
      context: ./deploy/backup
    restart: "no"
    logging: *logging
    depends_on:
      db:
        condition: service_healthy
    networks: [data]
    environment: *backup-env

  migrate:
    build:
      context: ./api
      dockerfile: Dockerfile.prod
    command: ["bin/api", "eval", "Api.Release.setup()"]
    restart: "no"
    logging: *logging
    depends_on:
      db:
        condition: service_healthy
      backup:
        condition: service_completed_successfully
    networks: [data]
    environment:
      DATABASE_ADMIN_URL: "ecto://postgres:${POSTGRES_PASSWORD}@db/${POSTGRES_DB}"
      DATABASE_URL: "ecto://${DATABASE_APP_USER}:${DATABASE_APP_PASSWORD}@db/${POSTGRES_DB}"
      DATABASE_APP_USER: ${DATABASE_APP_USER}
      DATABASE_APP_PASSWORD: ${DATABASE_APP_PASSWORD}
      # Role de LEITURA do Grafana (doc 73). Ausente = não criado, e os painéis de banco ficam com
      # erro de conexão — visível, em vez de painel vazio. Ele só recebe SELECT nas views
      # `metrics_*`; tabela nenhuma, nem por ALTER DEFAULT PRIVILEGES.
      DATABASE_METRICS_PASSWORD: ${DATABASE_METRICS_PASSWORD:-}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      TOKEN_SIGNING_SECRET: ${TOKEN_SIGNING_SECRET}
      PHX_SERVER: "false"

  api:
    build:
      context: ./api
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    logging: *logging
    depends_on:
      migrate:
        condition: service_completed_successfully
    # `data` e `app` são por-stack (namespaced). `dokploy-network` é EXTERNA e compartilhada por
    # TODOS os stacks — e ali o alias padrão `api` COLIDE entre hml e prod (o web fazia round-robin
    # e às vezes falava com o api do outro ambiente). O alias `api-${STACK}` é único → o web chama
    # ele (ver API_URL do web). O Traefik não usa esse DNS (acha o container pelos labels).
    networks:
      data:
      app:
      dokploy-network:
        aliases:
          - api-${STACK}
    environment:
      DATABASE_URL: "ecto://${DATABASE_APP_USER}:${DATABASE_APP_PASSWORD}@db/${POSTGRES_DB}"
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      TOKEN_SIGNING_SECRET: ${TOKEN_SIGNING_SECRET}
      # Host público da API = o domínio único (só /socket e /webhooks chegam nela).
      PHX_HOST: ${WEB_HOST}
      # check_origin do WebSocket = origem do WEB (o Origin do upgrade é a página do web).
      WEB_APP_URL: "https://${WEB_HOST}"
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: "https://${WEB_HOST}/auth"
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_BUCKET: ${R2_BUCKET}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      # Comunicação com o paciente (doc 52 / doc 65). Faltavam AQUI enquanto o cabeçalho deste
      # arquivo já roteava `/webhooks` para a API — e as duas ausências são silenciosas:
      #
      #   * sem RESEND_API_KEY o mailer cai no adapter `Local` (runtime.exs) e NENHUM e-mail sai,
      #     inclusive o magic link: ninguém entra no sistema, e o log não diz por quê;
      #   * sem RESEND_WEBHOOK_SECRET o webhook é fail-closed e responde 401 em TODO evento. O
      #     Resend reentrega por horas e a timeline congela em `enviado` para sempre.
      #
      # `:?` e não `${VAR}` seco: omitir o default NÃO protege nada — o compose substitui por
      # string vazia e segue, com um warning no log do deploy que ninguém lê. O `:?` **aborta o
      # `up`** com a mensagem abaixo, que é a única forma de "esqueci de preencher no Dokploy"
      # virar um erro em vez dos dois sintomas silenciosos acima. É o que `SECRET_KEY_BASE`
      # consegue de graça pelo `raise` do runtime.exs, e que estas não têm.
      RESEND_API_KEY: ${RESEND_API_KEY:?sem ela nenhum e-mail sai, nem o magic link}
      RESEND_WEBHOOK_SECRET: ${RESEND_WEBHOOK_SECRET:?o webhook responde 401 em todo evento sem ela}
      # O remetente precisa ser de domínio verificado no Resend, e é POR AMBIENTE: prod manda do
      # domínio real, HML de um subdomínio próprio — nunca do mesmo, senão um teste em homologação
      # queima a reputação de envio da produção.
      MAIL_FROM: ${MAIL_FROM:?remetente de dominio verificado no Resend, um por ambiente}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Cinetra}
      # Fase 2, WhatsApp via Zernio (doc 65). Vazio = canal desligado, que é o estado em que o
      # stack nasce — e é por isso que estas TÊM default, ao contrário das de cima.
      #
      # Passar a env vazia não liga nada (quem liga é a flag, e as credenciais são independentes
      # dela por decisão do `Api.Messaging.Transport`). O que isto compra é que o dia de ligar o
      # WhatsApp seja preencher campo no Dokploy, e não reencenar o bug do Resend em outro canal.
      WHATSAPP_HABILITADO: ${WHATSAPP_HABILITADO:-false}
      ZERNIO_API_KEY: ${ZERNIO_API_KEY:-}
      ZERNIO_ACCOUNT_ID: ${ZERNIO_ACCOUNT_ID:-}
      ZERNIO_BASE_URL: ${ZERNIO_BASE_URL:-}
      ZERNIO_WEBHOOK_SECRET: ${ZERNIO_WEBHOOK_SECRET:-}
      # Heartbeat dos crons do Oban (docs/62 §9). Roda AQUI, no container da API — não no do
      # backup, que tem o seu próprio. Mesma raiz, um slug por job (ver runtime.exs). Vazio =
      # desligado; faltar a env aqui faria os seis checks alarmarem "não rodou" para sempre.
      HEARTBEAT_BASE_URL: ${HEARTBEAT_BASE_URL:-}
      HEARTBEAT_SLUG_PREFIX: ${HEARTBEAT_SLUG_PREFIX:-}
      # Traces (doc 76). VAZIO = exportador `:none`: os spans nascem, medem e morrem em memória,
      # e o serviço fica idêntico ao que era. Para ligar, `http://alloy:4317` — o agente, não o
      # Tempo, porque é no agente que a poda de atributos mora.
      #
      # O `alloy` só resolve daqui se o stack de observabilidade tiver entrado na rede `app`
      # (`APP_NETWORK_OTLP` no .env dele). Ligar esta variável sem aquilo dá SDK tentando e
      # desistindo em silêncio, com a aplicação perfeita e sem trace nenhum.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      # Nome do serviço e ambiente saem daqui (padrão OTel, lido pelo SDK) em vez de config em
      # Elixir — assim o BFF em Node usa exatamente o mesmo mecanismo. `${STACK}` já distingue
      # prod de HML no resto do arquivo.
      OTEL_SERVICE_NAME: cinetra-api
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=${STACK}
      PHX_SERVER: "true"
      PORT: "4000"
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      # /socket -> API (WebSocket do browser). Prioridade > catch-all do web.
      - traefik.http.routers.cinetra-api-socket-${STACK}.rule=Host(`${WEB_HOST}`) && PathPrefix(`/socket`)
      - traefik.http.routers.cinetra-api-socket-${STACK}.entrypoints=websecure
      - traefik.http.routers.cinetra-api-socket-${STACK}.tls=true
      - traefik.http.routers.cinetra-api-socket-${STACK}.priority=100
      - traefik.http.routers.cinetra-api-socket-${STACK}.service=cinetra-api-${STACK}
      # /webhooks -> API (provedores externos: Resend e os próximos).
      - traefik.http.routers.cinetra-api-webhooks-${STACK}.rule=Host(`${WEB_HOST}`) && PathPrefix(`/webhooks`)
      - traefik.http.routers.cinetra-api-webhooks-${STACK}.entrypoints=websecure
      - traefik.http.routers.cinetra-api-webhooks-${STACK}.tls=true
      - traefik.http.routers.cinetra-api-webhooks-${STACK}.priority=100
      - traefik.http.routers.cinetra-api-webhooks-${STACK}.service=cinetra-api-${STACK}
      # Serviço (compartilhado pelos dois routers) + health pelo Traefik (a imagem não tem curl).
      # Aponta para **/api/ready**, não /api/health: quem decide rotear tráfego precisa saber se a
      # instância consegue SERVIR (banco + pool), não só se o BEAM respira. O /api/health é o
      # liveness — sem I/O, para que um blip do Postgres não faça reiniciar máquina saudável
      # (doc 62 §7.1). Ambas ficam fora do pipeline `:authenticated`.
      - traefik.http.services.cinetra-api-${STACK}.loadbalancer.server.port=4000
      - traefik.http.services.cinetra-api-${STACK}.loadbalancer.healthcheck.path=/api/ready
      - traefik.http.services.cinetra-api-${STACK}.loadbalancer.healthcheck.interval=10s

  web:
    build:
      context: ./web
      dockerfile: Dockerfile.prod
      args:
        # CSP build-time (kit.csp). Agora o socket é wss://${WEB_HOST}/socket — a origem pública
        # da API colapsou no domínio único. Guarda de boot derruba o container se runtime divergir.
        API_PUBLIC_ORIGIN: "https://${WEB_HOST}"
        R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
    restart: unless-stopped
    logging: *logging
    depends_on:
      - api
    networks: [app, dokploy-network]
    environment:
      API_URL: "http://api-${STACK}:4000"       # BFF -> API do PRÓPRIO stack (alias único; `api` puro colide na dokploy-network entre stacks)
      API_PUBLIC_ORIGIN: "https://${WEB_HOST}"  # socket wss no mesmo domínio
      ORIGIN: "https://${WEB_HOST}"             # CSRF, URLs absolutas, decide o HSTS
      ADDRESS_HEADER: "CF-Connecting-IP"        # atrás do Cloudflare: IP real do cliente (docs/59 §5.1)
      # Traces (doc 76). Vazio = o `otel.mjs` não constrói o SDK e o processo fica idêntico.
      # Porta 4318 (OTLP/HTTP) contra 4317 (gRPC) da API: cada SDK usa o protocolo batido na sua
      # comunidade, e o Alloy escuta os dois. O `--import ./otel.mjs` já está no Dockerfile.prod.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT_WEB:-}
      OTEL_SERVICE_NAME: cinetra-web
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=${STACK}
      PORT: "3000"
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      # Catch-all do domínio: tudo que não for /socket nem /webhooks. Prioridade < a da API.
      - traefik.http.routers.cinetra-web-${STACK}.rule=Host(`${WEB_HOST}`)
      - traefik.http.routers.cinetra-web-${STACK}.entrypoints=websecure
      - traefik.http.routers.cinetra-web-${STACK}.tls=true
      - traefik.http.routers.cinetra-web-${STACK}.priority=1
      - traefik.http.services.cinetra-web-${STACK}.loadbalancer.server.port=3000
      # Health do BFF, que não existia. Aponta para **/health** (liveness), NÃO para /ready: o
      # /ready depende da API, e tirar o BFF da rotação quando a API pisca faz o site deixar de
      # servir até a página de erro. Degradar é melhor que desaparecer.
      # Quem precisa saber se o PRODUTO está usável é o monitor externo, e esse bate em /ready
      # (doc 62 §9.4) — mesmos dois endpoints, consumidores e semânticas diferentes.
      - traefik.http.services.cinetra-web-${STACK}.loadbalancer.healthcheck.path=/health
      - traefik.http.services.cinetra-web-${STACK}.loadbalancer.healthcheck.interval=10s

  # Backup AGENDADO 1/1h (o pré-deploy cobre t=0).
  backup-cron:
    build:
      context: ./deploy/backup
    restart: unless-stopped
    logging: *logging
    command: ["sh", "-c", "while true; do sleep 3600; /backup.sh || echo '[backup-cron] falhou'; done"]
    depends_on:
      db:
        condition: service_healthy
    networks: [data]
    environment: *backup-env

volumes:
  pgdata:

networks:
  data: # só db + migrate + api — o web NÃO entra (só a API fala com o banco)
  app: # web <-> api, interno
  dokploy-network:
    external: true
