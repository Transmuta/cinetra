# Prometheus — o banco de série temporal das métricas (doc 74).
#
# ## Por que Prometheus SÓ raspa, e não descobre
#
# O Alloy ao lado usa `discovery.docker`: ele lê o daemon do Docker e acha container sozinho.
# Aqui os alvos são ESTÁTICOS, de propósito, e a diferença vale ser dita porque parece um
# retrocesso e não é:
#
#   * descoberta exigiria montar `/var/run/docker.sock` num segundo container. O socket do Docker
#     montado é equivalente a root na máquina — o `compose.obs.yml` já comenta isso a respeito do
#     Alloy. Repetir a exposição para poupar quatro linhas de YAML é troca ruim;
#   * são QUATRO alvos, e eles mudam quando um serviço novo nasce — não a cada deploy. Uma lista
#     que muda por trimestre não justifica um mecanismo de descoberta.
#
# ## Este arquivo NÃO expande variável de ambiente — e é por isso que os alvos da API saem dele
#
# O Prometheus não interpola `${VAR}` na configuração, diferente do `loki.yml` ao lado, que só
# funciona porque sobe com `-config.expand-env=true`. Tentar parametrizar aqui com `${...}` não dá
# erro: ele resolve `${METRICS_API_HOST}` como um host de verdade, falha o DNS, e o alvo fica
# `DOWN` com uma mensagem que ninguém associa à causa.
#
# A primeira versão respondia a isso mandando produção EDITAR este arquivo. Não presta: torna o
# deploy um passo manual, e um arquivo que difere entre ambientes deixa de ser revisável — o diff
# do PR passa a mentir sobre o que roda em produção.
#
# A solução é `file_sd_configs` no job `api`: **este arquivo serve os dois ambientes**, e só a
# LISTA DE HOSTS sai para `targets/`, que é um arquivo de três linhas escolhido por variável no
# compose. De brinde, o `file_sd` recarrega sozinho — acrescentar um alvo não reinicia o
# Prometheus nem perde a série em memória.
#
# ## Cada job tem uma LISTA DE MANTER, e ela é a parte mais importante deste arquivo (doc 86)
#
# Sem `metric_relabel_configs`, os quatro alvos entregam **755 nomes de métrica e 7.567 séries**.
# Medido em 2026-07-29, e o problema não é o custo — é que a tela *Drilldown → Metrics* do Grafana
# desenha um mini-gráfico por métrica coletada, então ela abria com 755 gráficos. Ninguém lê 755
# gráficos; o efeito prático de coletar tudo foi tornar a coleta inteira ilegível.
#
# O contraste que decidiu a questão: os 12 dashboards e todos os alertas juntos referenciam **25
# métricas**. Coletávamos 755 para desenhar 25.
#
#   fonte                       nomes   séries   usadas
#   PromEx (a nossa API)           98    2.908        9
#   cAdvisor (containers)          69    2.466        4
#   node_exporter (máquina)       266    1.266       11
#   Prometheus sobre si mesmo     311      869        1  (só o `up`)
#
# Os maiores desperdícios eram métricas que nenhum painel jamais abriu: `container_fs_*` (~1.500
# séries), `phoenix_http_response_size_bytes_bucket` (576) e os tempos de Ecto que não usamos —
# `execution_time` e `results_returned` (651 juntos).
#
# ### Por que `keep` (lista de manter) e não `drop` (lista de descartar)
#
# Uma lista de descartar envelhece contra você: subir a versão do node_exporter ou ligar um plugin
# novo do PromEx acrescenta nomes que ninguém previu, e eles entram calados. A lista de manter
# falha do lado seguro — o que é novo fica de fora até alguém decidir que entra.
#
# ### O critério: GENEROSO, não mínimo
#
# A lista não é "as 25 usadas". Ela mantém a **família inteira** quando a família é barata e é o
# tipo de coisa que se procura no meio de um incidente — `node_load*`, `node_pressure_*`,
# `node_memory_*`, `run_queue_count` da BEAM. Cortar até 25 economizaria mais e custaria caro uma
# vez só: métrica podada não existe nem no histórico, então descobrir no incidente que você quer
# `node_load1` significa religar e **esperar coletar de novo** — justo quando não há tempo.
#
# O que foi cortado sem dó é o que não responde pergunta nenhuma sobre este sistema: o Prometheus
# se auto-observando (`go_*`, `process_*`, `promhttp_*`), a telemetria de rede de baixo nível
# (`node_netstat_*`, `node_sockstat_*`, `node_timex_*`, `node_softnet_*`), hardware que uma VM não
# tem (`node_hwmon_*`, `node_power_supply_*`, `node_cooling_device_*`) e os `*_info` do PromEx, que
# são constantes de build travestidas de série temporal.
#
# ### ATENÇÃO — `up` e `scrape_*` NÃO passam por aqui
#
# As cinco métricas sintéticas do raspador — `up`, `scrape_duration_seconds`,
# `scrape_samples_scraped`, `scrape_samples_post_metric_relabeling` e `scrape_series_added` — são
# anexadas pelo laço de raspagem **depois** do `metric_relabel_configs`. Elas sobrevivem sem estar
# em lista nenhuma: medido, com a lista do job `prometheus` cortando 311 nomes para 2 e o
# `up{job="prometheus"}` continuando de pé. Não tente "garantir" o `up` acrescentando-o à lista de
# manter — além de inútil, dá a impressão errada de que ele viria do alvo.
#
# As duas últimas são, por acaso, o melhor par de painéis para auditar esta poda: `scrape_samples_
# scraped` é o que o alvo ofereceu e `..._post_metric_relabeling` é o que entrou. Medido depois de
# aplicar, por raspagem: node 1.316 → 273, api 3.534 → 1.542, cadvisor 655 → 261 (e os 655 já são
# depois do corte na fonte, de ~2.400), prometheus 743 → 2.

global:
  # 15 s é o intervalo que o `rate()` dos painéis assume. Mudar aqui sem mudar as janelas dos
  # dashboards (`[5m]`) não quebra nada, mas desafina a suavização — a regra prática do
  # Prometheus é janela ≥ 4× o intervalo de raspagem.
  scrape_interval: 15s
  scrape_timeout: 10s
  # ATENÇÃO — `external_labels` NÃO é visível em consulta local. Ele é anexado só quando o dado
  # SAI daqui: `remote_write`, federação e notificação de alerta. Um `sum by (ambiente) (...)` no
  # painel devolve vazio, e `label_values(ambiente)` devolve lista vazia — medido, e é o tipo de
  # engano que se paga com uma hora achando que a coleta quebrou.
  #
  # Quem precisa distinguir ambiente DENTRO da consulta usa o label `env` do próprio alvo, no
  # bloco `static_configs` do job `api` lá embaixo. Este aqui serve a outra coisa: identificar
  # qual Prometheus disparou o alerta, quando um dia houver mais de um.
  external_labels:
    ambiente: dev

scrape_configs:
  # ---- A MÁQUINA -------------------------------------------------------------------------------
  # CPU, load, memória, swap, disco (uso e I/O), rede, uptime. É a fonte que faltava: o Loki sabe
  # que a requisição demorou 3 s; só isto aqui sabe que a CPU estava em 100%.
  #
  # SEM label `env`, e é deliberado: a máquina é UMA, compartilhada por produção e homologação.
  # Carimbar `env=prod` aqui criaria a ilusão de que existe um disco de produção separado do de
  # homologação — quando na verdade quem encher o disco derruba os dois.
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
    # Lista de manter: 266 nomes → 47. O regex do Prometheus é ANCORADO nas duas pontas, então
    # `node_load1` casa `node_load1` e nada mais — não precisa de `^...$`.
    #
    # Ele tem de ser UMA LINHA. Dobrar em YAML com `>-` junta as linhas com ESPAÇO, e o espaço
    # entra no regex: a lista passa a não casar nada, o job fica sem série e o painel fica vazio —
    # que é o modo de falha mais caro deste arquivo, porque vazio lê-se como "está tudo calmo".
    # Daí os grupos viverem no comentário abaixo, e não na indentação.
    #
    #   carga e CPU ....... load1/5/15, cpu_seconds_total
    #   saturação (PSI) ... pressure_*  — o sinal que distingue "sem CPU" de "esperando disco"
    #   memória ........... MemTotal/MemAvailable/MemFree/Cached/Buffers/Dirty + swap
    #   disco ............. espaço (filesystem_*), I/O (read/written, reads/writes, io_time, io_now)
    #   rede .............. bytes, erros e descartes por interface + estado do link
    #   pressão real ...... vmstat_oom_kill (o OOM aconteceu), pgmajfault (está paginando)
    #   limites ........... nf_conntrack (tabela de conexão), filefd (descritores)
    #   processos ......... procs_running/blocked
    #   identidade ........ boot_time_seconds (detecta reboot), uname_info
    metric_relabel_configs:
      - source_labels: [__name__]
        action: keep
        regex: node_load1|node_load5|node_load15|node_cpu_seconds_total|node_pressure_cpu_waiting_seconds_total|node_pressure_io_stalled_seconds_total|node_pressure_io_waiting_seconds_total|node_pressure_memory_stalled_seconds_total|node_pressure_memory_waiting_seconds_total|node_memory_MemTotal_bytes|node_memory_MemAvailable_bytes|node_memory_MemFree_bytes|node_memory_Cached_bytes|node_memory_Buffers_bytes|node_memory_Dirty_bytes|node_memory_SwapTotal_bytes|node_memory_SwapFree_bytes|node_filesystem_avail_bytes|node_filesystem_size_bytes|node_filesystem_free_bytes|node_filesystem_files|node_filesystem_files_free|node_filesystem_readonly|node_filesystem_device_error|node_disk_read_bytes_total|node_disk_written_bytes_total|node_disk_reads_completed_total|node_disk_writes_completed_total|node_disk_io_time_seconds_total|node_disk_io_now|node_network_receive_bytes_total|node_network_transmit_bytes_total|node_network_receive_errs_total|node_network_transmit_errs_total|node_network_receive_drop_total|node_network_transmit_drop_total|node_network_up|node_vmstat_oom_kill|node_vmstat_pgmajfault|node_nf_conntrack_entries|node_nf_conntrack_entries_limit|node_filefd_allocated|node_filefd_maximum|node_procs_running|node_procs_blocked|node_boot_time_seconds|node_uname_info

  # ---- OS CONTAINERS ---------------------------------------------------------------------------
  # CPU e memória POR container, e o contador de reinícios. Responde a pergunta que o node
  # exporter não responde: "a memória da máquina subiu — de quem?".
  #
  # O `mem_limit` de cada serviço vira `container_spec_memory_limit_bytes`, então dá para desenhar
  # uso CONTRA o teto, que é o número que antecede o OOM kill.
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
    # Lista de manter: 69 nomes → 25.
    #
    # O gordo daqui — `container_fs_*`, ~1.500 séries, uma por container × dispositivo — é cortado
    # DUAS vezes, e de propósito: `--disable_metrics=...,disk,diskIO` no `compose.obs.yml` impede o
    # cAdvisor de CALCULAR (ele varria cgroup de bloco a cada 15 s para ninguém ler), e a lista
    # abaixo é a rede de segurança para o dia em que alguém mexer naquele flag sem passar por aqui.
    #
    # Perder disco POR CONTAINER é uma troca consciente: nenhum painel usava, e a pergunta que
    # importa — "o disco vai encher?" — é do `node_filesystem_*`, que mede a partição de verdade.
    #
    #   CPU ............... usage/system/user_seconds_total
    #   memória ........... working_set (o número que o OOM killer olha), usage, rss, cache, swap,
    #                       max_usage + o TETO (spec_memory_limit_bytes) para desenhar % do limite
    #   rede .............. bytes e erros por container
    #   ciclo de vida ..... start_time_seconds (reinício), last_seen, oom_events_total, health_state
    #   a máquina ......... machine_cpu_cores/memory_bytes — o denominador dos painéis de %
    #   a própria coleta .. *_scrape_error
    metric_relabel_configs:
      - source_labels: [__name__]
        action: keep
        regex: container_cpu_usage_seconds_total|container_cpu_system_seconds_total|container_cpu_user_seconds_total|container_memory_working_set_bytes|container_memory_usage_bytes|container_memory_rss|container_memory_cache|container_memory_swap|container_memory_max_usage_bytes|container_spec_memory_limit_bytes|container_spec_cpu_shares|container_spec_cpu_period|container_network_receive_bytes_total|container_network_transmit_bytes_total|container_network_receive_errors_total|container_network_transmit_errors_total|container_start_time_seconds|container_last_seen|container_oom_events_total|container_health_state|container_scrape_error|machine_cpu_cores|machine_memory_bytes|machine_swap_bytes|machine_scrape_error

  # ---- A APLICAÇÃO -----------------------------------------------------------------------------
  # PromEx (doc 74): BEAM, pool do Ecto, filas do Oban, latência por rota.
  #
  # A lista de hosts vem de `targets/`, montado pelo compose em `PROMETHEUS_TARGETS` — em dev,
  # `targets/api-dev.yml`; em produção, `targets/api-prod.yml`, que lista os dois stacks.
  #
  # O label `env` é responsabilidade daquele arquivo, não deste: é ele que sabe qual container é
  # produção e qual é homologação. Sem um `env` por alvo, as séries dos dois ambientes caem na
  # mesma linha do painel e o pico de homologação passa a parecer pico de produção.
  - job_name: api
    metrics_path: /metrics
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/api.yml
        # O `file_sd` já observa o arquivo por inotify; este intervalo é a rede para o caso de o
        # arquivo chegar por bind mount que não propaga evento — o que é exatamente o caso aqui.
        refresh_interval: 30s
    # Lista de manter: 98 nomes → 38, e de 3.534 amostras por raspagem para 1.542. É o job que mais
    # economiza em número absoluto e, mesmo podado, o que continua maior — porque histograma
    # multiplica: cada `_bucket` rende uma série por FAIXA × rota × método × status. Os ~1.200 que
    # sobram são quase todos os buckets de `http_request_duration` e dos dois tempos de Ecto, e eles
    # ficam porque são exatamente o que desenha p95 — o número que se olha primeiro.
    #
    # Por que a poda é aqui e não no `Api.PromEx` — os plugins são pacote fechado. Não existe
    # "ligar o Ecto sem o `results_returned`"; ou o plugin entra inteiro, ou a métrica que
    # importa (`queue_time`, o aviso que chega antes do timeout) sai junto. Então os cinco plugins
    # continuam ligados lá, e a escolha do que ATRAVESSA é feita aqui.
    #
    #   HTTP .............. requests_total + duration (é dele que sai o p95 por rota)
    #   canais ............ channel_joined_total — WebSocket é caminho de primeira classe aqui
    #   pool do Ecto ...... queue_time (espera por conexão) e total_time. Com RLS por transação
    #                       (ADR-018) toda leitura ocupa uma conexão, então este é O gargalo
    #   Oban .............. queue_length (fila crescendo = lembrete que não sai) + espera e duração
    #   BEAM .............. memória por categoria (7 nomes, 1 série cada) e as contagens, entre
    #                       elas `run_queue_count`, que separa "sem CPU" de "esperando I/O"
    #   reinício .......... uptime que zera é a evidência mais direta de crash loop
    #   versão ............ application_primary_info — diz QUAL deploy está no ar
    #
    # Cortado: `response_size_bytes` (576 séries, nunca aberto), os tempos de Ecto que não usamos
    # (`execution_time`, `decode_time`, `idle_time`, `results_returned`), `oban_producer_*`,
    # `job_complete_attempts` e todos os `*_info` de sistema — `beam_system_*`, `git_*`,
    # `dependency_info`, `endpoint_*`, `*_init_*`. Estes últimos são constante de build: valor 1
    # para sempre, ocupando série temporal para nunca variar.
    metric_relabel_configs:
      - source_labels: [__name__]
        action: keep
        regex: api_prom_ex_phoenix_http_requests_total|api_prom_ex_phoenix_http_request_duration_milliseconds_bucket|api_prom_ex_phoenix_http_request_duration_milliseconds_count|api_prom_ex_phoenix_http_request_duration_milliseconds_sum|api_prom_ex_phoenix_channel_joined_total|api_prom_ex_ecto_repo_query_queue_time_milliseconds_bucket|api_prom_ex_ecto_repo_query_queue_time_milliseconds_count|api_prom_ex_ecto_repo_query_queue_time_milliseconds_sum|api_prom_ex_ecto_repo_query_total_time_milliseconds_bucket|api_prom_ex_ecto_repo_query_total_time_milliseconds_count|api_prom_ex_ecto_repo_query_total_time_milliseconds_sum|api_prom_ex_oban_queue_length_count|api_prom_ex_oban_job_queue_time_milliseconds_bucket|api_prom_ex_oban_job_queue_time_milliseconds_count|api_prom_ex_oban_job_queue_time_milliseconds_sum|api_prom_ex_oban_job_processing_duration_milliseconds_bucket|api_prom_ex_oban_job_processing_duration_milliseconds_count|api_prom_ex_oban_job_processing_duration_milliseconds_sum|api_prom_ex_beam_memory_allocated_bytes|api_prom_ex_beam_memory_atom_total_bytes|api_prom_ex_beam_memory_binary_total_bytes|api_prom_ex_beam_memory_code_total_bytes|api_prom_ex_beam_memory_ets_total_bytes|api_prom_ex_beam_memory_persistent_term_total_bytes|api_prom_ex_beam_memory_processes_total_bytes|api_prom_ex_beam_stats_process_count|api_prom_ex_beam_stats_port_count|api_prom_ex_beam_stats_ets_count|api_prom_ex_beam_stats_atom_count|api_prom_ex_beam_stats_run_queue_count|api_prom_ex_beam_stats_active_task_count|api_prom_ex_beam_stats_gc_count|api_prom_ex_beam_stats_gc_reclaimed_bytes|api_prom_ex_beam_stats_context_switch_count|api_prom_ex_beam_stats_reduction_count|api_prom_ex_beam_stats_uptime_milliseconds_count|api_prom_ex_application_uptime_milliseconds_count|api_prom_ex_application_primary_info

  # ---- O PRÓPRIO PROMETHEUS --------------------------------------------------------------------
  # Barato e é o que responde "o painel está vazio porque não há problema, ou porque a coleta
  # morreu?". A mesma pergunta que o doc 62 §11.3 teve de responder para o Loki, e que custou
  # duas depurações num dia só quando não havia como.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
    # Lista de manter: 311 nomes → 2. É o corte mais radical do arquivo, e o mais fácil de
    # defender: 311 nomes descreviam o coletor de lixo do Go, os descritores de arquivo do processo
    # e a latência interna do WAL do TSDB. Nada disso responde pergunta sobre a clínica.
    #
    # O que este job de fato entrega é o `up{job=...}` — e ele NÃO vem do alvo, vem do laço de
    # raspagem (ver o aviso no cabeçalho). Por isso a resposta a "a coleta morreu ou está tudo
    # calmo?" continua inteira mesmo cortando 309 nomes.
    #
    #   tsdb_head_series .. quantas séries existem AGORA. É o painel que mostra se esta poda segue
    #                       valendo — cardinalidade cresce sozinha quando alguém acrescenta label
    #   build_info ........ a versão, uma série, útil quando o comportamento muda após upgrade
    metric_relabel_configs:
      - source_labels: [__name__]
        action: keep
        regex: prometheus_tsdb_head_series|prometheus_build_info

  # ---- A PRÓPRIA OBSERVABILIDADE ---------------------------------------------------------------
  # R-M14 (doc 95, onda 4 do doc 102). O buraco não era teórico: `grafana-alertas.yml` manda o
  # operador, no meio do alerta "pipeline de log parado" às 3h, comparar TRÊS contadores —
  # `loki_source_docker_target_entries_total`, `loki_write_dropped_entries_total` e
  # `loki_distributor_lines_received_total`. **Nenhum job raspava nenhum deles.** O runbook
  # apontava para "No data", e a conclusão natural de quem lê "No data" no meio de um incidente é
  # que a coleta também caiu — o que manda a investigação para o lado errado.
  #
  # Os nomes abaixo foram VERIFICADOS subindo cada imagem e lendo `/metrics`, e não copiados de
  # documentação. Duas coisas que só aparecem assim:
  #
  #   * as métricas de componente do Alloy são registradas com PREGUIÇA: com config vazia, ou com
  #     um `loki.write` que nunca entregou nada, a família `loki_write_*` **não existe**. Ela só
  #     aparece depois que a primeira linha flui. Foi preciso fazer log de verdade circular para
  #     confirmar que `loki_write_dropped_entries_total` existe mesmo (e existe);
  #   * `loki_distributor_lines_received_total` idem no Loki: só materializa após o primeiro push.
  #
  # **O que NÃO foi verificado ao vivo: o Tempo.** A imagem não subiu com config improvisada aqui,
  # então os nomes dele vêm da convenção da família (`tempo_distributor_*`, `tempo_ingester_*`,
  # `tempo_request_*`). Se algum estiver errado, o sintoma é painel/alerta vazio — e quem pega isso
  # é a seção nova do `verificar.sh`, que confere se toda métrica citada num alerta RESPONDE.
  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]
    # Recorte pela pergunta "o Loki está RECEBENDO e conseguindo guardar?". `lines_received` é a
    # terceira ponta do runbook do pipeline: com o agente lendo e entregando, é ela que diz se o
    # problema é do outro lado.
    metric_relabel_configs:
      - source_labels: [__name__]
        action: keep
        regex: loki_distributor_lines_received_total|loki_distributor_bytes_received_total|loki_ingester_streams_created_total|loki_ingester_chunks_flushed_total|loki_ingester_chunk_age_seconds_sum|loki_ingester_chunk_age_seconds_count|loki_request_duration_seconds_count|loki_request_duration_seconds_sum|loki_panic_total|loki_build_info

  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]
    # As duas primeiras famílias são o runbook do alerta `cinetra-pipeline-parado`; a terceira
    # (`otelcol_*`) é o mesmo par de perguntas para o caminho de TRACE, que hoje não tem métrica
    # nenhuma — o Alloy pode estar descartando span e nada avisa.
    #
    # `loki_write_dropped_entries_total` é a métrica mais importante deste arquivo inteiro: ela
    # distingue "não há log" de "o log está sendo JOGADO FORA", e o alerta de pipeline parado só
    # dispara quando o total zera 10 min depois. Descarte parcial era invisível.
    metric_relabel_configs:
      - source_labels: [__name__]
        action: keep
        regex: loki_write_.*|loki_source_.*|alloy_build_info|alloy_component_controller_running_components|otelcol_receiver_accepted_spans_total|otelcol_receiver_refused_spans_total|otelcol_exporter_sent_spans_total|otelcol_exporter_send_failed_spans_total|otelcol_processor_dropped_spans_total

  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]
    # Nomes NÃO verificados ao vivo — ver o aviso no topo deste bloco.
    metric_relabel_configs:
      - source_labels: [__name__]
        action: keep
        regex: tempo_distributor_spans_received_total|tempo_distributor_bytes_received_total|tempo_ingester_traces_created_total|tempo_ingester_blocks_flushed_total|tempo_request_duration_seconds_count|tempo_build_info

  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]
    # O motor de alerta vigiando a si mesmo — que é o que fecha o R-C1 no TEMPO, e não só no dia
    # em que alguém rodou o `verificar.sh`. `notification_latency_seconds_count` sobe a cada
    # notificação ENTREGUE: parado com alerta ativo significa que o contato voltou a não funcionar.
    #
    # `alerts_invalid_total` pega o outro modo de falha: regra provisionada que o Grafana recusou.
    # Sem ela, uma regra com erro de sintaxe simplesmente não existe, e nada diz isso.
    metric_relabel_configs:
      - source_labels: [__name__]
        action: keep
