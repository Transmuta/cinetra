# Alertas do Grafana, provisionados por arquivo (doc 62 §11).
#
# ## O que estes alertas SÃO e o que não são
#
# Eles cobrem "o sistema está se comportando mal" — erro subindo, latência degradando, job
# falhando. **Não** cobrem "o sistema morreu" nem "o cron parou": esses dois vivem no monitor
# EXTERNO (§9), porque um alerta hospedado na máquina que caiu não é enviado. As duas camadas são
# complementares e nenhuma substitui a outra.
#
# ## Por que arquivo e não a UI
#
# Mesma razão dos dashboards: a máquina é descartável e regra montada na tela some com o
# container. Em arquivo, a regra é revisável em PR — e alerta é justamente o tipo de coisa que
# precisa de revisão, porque limiar errado treina a equipe a ignorar o aviso.
#
# ## Antes de confiar neles
#
# Configure o contato (`GF_SMTP_*` no compose, ou um webhook) e **prove que chega**. Alerta que
# dispara e fica só na tela é painel, não alerta.
#
# **Feito em 2026-08-04** (R-C1, onda 1 do doc 102): o contato e a árvore de roteamento agora são
# provisionados neste arquivo — ver o fim do bloco `contactPoints`/`policies` logo abaixo. O que
# ainda depende de operação é o SMTP (`GRAFANA_SMTP_*` no `.env.local`) e a **prova de entrega**,
# que é a §16 do `verificar.sh`.
apiVersion: 1

# ---- Para ONDE o alerta vai ------------------------------------------------------------------
#
# Isto existia como buraco, não como decisão: as 9 regras abaixo caíam na notification policy
# default do Grafana, que aponta para o contact point embutido `grafana-default-email` — endereço
# placeholder, e SMTP desligado por default no compose. O resultado era **detecção sem
# notificação**: 12 dashboards, dead man's switch nos dois pipelines e poda de métrica medida, tudo
# produzindo vermelho numa aba que ninguém tem aberta às 3h.
#
# Um controle de detecção que não notifica não é um controle parcial. Ele é zero, e pior que zero,
# porque cria a sensação de estar coberto.
#
# ## Por que provisionado, e não montado na tela
#
# Mesma razão das regras e dos dashboards, e ela vale MAIS aqui: contato montado na UI vive no
# volume `grafana_data` e some quando o container é recriado — numa máquina que o próprio doc 87
# chama de descartável. Em arquivo, ele é revisável em PR e volta sozinho.
#
# **Efeito colateral a saber:** o que é provisionado fica READ-ONLY na interface. Trocar o
# destinatário passa a ser editar `GRAFANA_ALERTA_EMAIL` no `.env.local` e redeployar o obs — não
# há mais o caminho de "mudar rápido na tela", e isso é intencional.
contactPoints:
  - orgId: 1
    name: cinetra-plantao
    receivers:
      - uid: cinetra-plantao-email
        type: email
        settings:
          # Interpolação de env em arquivo provisionado — a mesma sintaxe já provada em produção
          # pelo `grafana-datasources.yml` (`${METRICS_DB_PASSWORD}`).
          #
          # Aceita lista separada por `;`. Vale mais de um endereço: contato único é bus factor 1
          # no exato momento em que ele importa.
          addresses: ${GRAFANA_ALERTA_EMAIL}
          # Um e-mail por GRUPO, não por instância. Com `false`, um alerta que dispara para 8
          # clínicas manda 8 e-mails — e a caixa cheia treina o olho a arquivar sem ler, que é o
          # mesmo fim do alarme que ninguém lê.
          singleEmail: true

# ---- Como o alerta é AGRUPADO e REPETIDO -----------------------------------------------------
#
# Um bloco `policies` provisionado SUBSTITUI a árvore default inteira. É o que se quer: enquanto a
# default existir, um alerta novo que ninguém roteou cai no `grafana-default-email` e some. Aqui a
# raiz é o plantão, então esquecer de rotear falha para o lado seguro.
policies:
  - orgId: 1
    receiver: cinetra-plantao
    # `alertname` + `grafana_folder` é o agrupamento default do Grafana e serve: o que se quer
    # junto num e-mail são as instâncias do MESMO alerta.
    group_by: ['grafana_folder', 'alertname']
    # 30s de espera para juntar instâncias que chegam quase ao mesmo tempo — abaixo disso o
    # agrupamento não agrupa nada.
    group_wait: 30s
    # 5 min até mandar de novo quando instâncias NOVAS entram num grupo já notificado.
    group_interval: 5m
    # 4h para repetir um alerta que continua disparando. É o teto do ruído para `aviso`.
    repeat_interval: 4h
    routes:
      # `critico` repete de hora em hora. A diferença com o `aviso` não é de gravidade no texto —
      # é de quantas vezes o sistema insiste antes de desistir de te acordar. Disco a 90% às 3h
      # com repetição de 4h dá **uma** chance de ver antes do disco encher.
      - receiver: cinetra-plantao
        object_matchers:
          - ['severity', '=', 'critico']
        group_by: ['grafana_folder', 'alertname']
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 1h

groups:
  - orgId: 1
    name: cinetra-criticos
    folder: Cinetra
    # De minuto em minuto: o suficiente para reagir, longe de sobrecarregar o Loki com consultas.
    interval: 1m
    rules:
      - uid: cinetra-erro-5xx
        title: Erros 5xx acima do normal
        # 5 min de `for` porque um pico de 30 segundos não é incidente — é deploy, reinício ou
        # blip de rede. O que interessa é erro que PERSISTE.
        for: 5m
        condition: alerta
        # `noDataState: OK` e não o padrão. Aqui "sem dado" significa **sem erro** — não há o que
        # alarmar. Com o padrão (`NoData`), toda instalação sem tráfego de `prod` acende um
        # `DatasourceNoData` permanente; medido: quatro alertas falsos ativos em dev, que é
        # exatamente o alarme-que-ninguém-mais-lê que este plano combate.
        noDataState: OK
        annotations:
          summary: "{{ $labels.env }}: erros 5xx sustentados há 5 minutos"
          description: >
            5xx é falha nossa, sempre. Abra o dashboard "Cinetra · Requisições", painel
            "Rotas que mais falham" — uma rota isolada é bug localizado; várias juntas é infra.
        labels:
          severity: critico
        data:
          - refId: consulta
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: loki
            model:
              refId: consulta
              # `sum by (env)` e não `sum`: agregação sem `by` colapsa numa série SEM rótulo, e o
              # `{{ $labels.env }}` do summary acima renderiza como `[no value]`. Ver o comentário
              # de `cinetra-coleta-de-metrica-parada`, onde essa classe foi descoberta.
              expr: sum by (env) (count_over_time({env="prod", level="error"} [5m]))
              queryType: instant
          - refId: alerta
            datasourceUid: __expr__
            model:
              refId: alerta
              type: threshold
              expression: consulta
              conditions:
                - evaluator: { type: gt, params: [10] }

      - uid: cinetra-pipeline-parado
        title: Pipeline de log parado
        # O alerta que este projeto aprendeu a precisar. Duas vezes num dia o pipeline parou com
        # TUDO verde: Loki healthy, `/ready` 200, Grafana no ar — e nada chegando. Liveness não
        # detecta ausência de dado; só a ausência detecta.
        #
        # É um dead man's switch INTERNO: complementa o heartbeat externo (§9), que vigia os crons.
        # Este vigia o próprio caminho do log. Um deles vigia o outro pela metade — se o Grafana
        # cair junto, quem fala é o monitor externo.
        for: 10m
        condition: alerta
        # `NoData` = pergunta sem resposta, que aqui é exatamente o sintoma: sem log, sem série.
        noDataState: Alerting
        annotations:
          # SEM `{{ $labels.env }}`, diferente das regras irmãs deste grupo — e é a consulta que
          # decide isso, não gosto. Esta regra dispara pelo caminho `NoData` (ver `noDataState`
          # logo acima): LogQL não emite série ZERADA para stream que parou, ele não emite série
          # nenhuma. E instância de `NoData` não carrega rótulo de consulta, venha a consulta com
          # `by (env)` ou sem. Prometer o ambiente aqui só produziria `[no value]`.
          summary: "Nenhum log chegou de ambiente nenhum nos últimos 10 minutos"
          description: >
            Ou o tráfego parou (o app caiu — confira o monitor externo), ou o caminho do log
            quebrou. Para distinguir, compare os três contadores:
            `loki_source_docker_target_entries_total` (o agente leu),
            `loki_write_dropped_entries_total` (o agente não conseguiu entregar) e
            `loki_distributor_lines_received_total` (o Loki recebeu).
            Ou rode `deploy/observability/verificar.sh`, seção 9.
        labels:
          severity: critico
        data:
          - refId: consulta
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: loki
            model:
              refId: consulta
              # `env=~".+"` e NÃO `env="prod"`: a pergunta é "chegou log de ALGUM lugar?".
              # Fixado em prod, este alerta dispara falso em toda instalação que não seja
              # produção — medido: com `noDataState: Alerting`, ele acendeu sozinho em dev e
              # virou exatamente o alarme falso que o resto deste plano combate.
              expr: sum(count_over_time({env=~".+"} [10m]))
              queryType: instant
          - refId: alerta
            datasourceUid: __expr__
            model:
              refId: alerta
              type: threshold
              expression: consulta
              conditions:
                - evaluator: { type: lt, params: [1] }

      - uid: cinetra-latencia-p95
        title: Latência p95 degradada
        for: 10m
        condition: alerta
        # `noDataState: OK` e não o padrão. Aqui "sem dado" significa **sem erro** — não há o que
        # alarmar. Com o padrão (`NoData`), toda instalação sem tráfego de `prod` acende um
        # `DatasourceNoData` permanente; medido: quatro alertas falsos ativos em dev, que é
        # exatamente o alarme-que-ninguém-mais-lê que este plano combate.
        noDataState: OK
        annotations:
          summary: "{{ $labels.env }}: p95 acima de 1s há 10 minutos"
          description: >
            O alvo do doc 05 §4.1 para leitura de agenda é 400 ms no p95. 1s aqui é o ponto em
            que a recepção sente. Ver "Cinetra · Requisições" → "Rotas mais lentas".
        labels:
          severity: aviso
        data:
          - refId: consulta
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: loki
            model:
              refId: consulta
              # `by (env)` e não `by ()`: a lista vazia agrega TUDO numa série sem rótulo, e o
              # `{{ $labels.env }}` do summary vira `[no value]`.
              expr: quantile_over_time(0.95, {env="prod", service=~".*api.*"} | json | unwrap duration_ms [10m]) by (env)
              queryType: instant
          - refId: alerta
            datasourceUid: __expr__
            model:
              refId: alerta
              type: threshold
              expression: consulta
              conditions:
                - evaluator: { type: gt, params: [1000] }

      - uid: cinetra-crash-browser
        title: Crashes no browser
        # 15 min: crash de browser costuma vir em rajada depois de um deploy ruim, e a rajada é o
        # sinal. Um crash isolado é um navegador estranho, não um incidente.
        for: 15m
        condition: alerta
        # `noDataState: OK` e não o padrão. Aqui "sem dado" significa **sem erro** — não há o que
        # alarmar. Com o padrão (`NoData`), toda instalação sem tráfego de `prod` acende um
        # `DatasourceNoData` permanente; medido: quatro alertas falsos ativos em dev, que é
        # exatamente o alarme-que-ninguém-mais-lê que este plano combate.
        noDataState: OK
        annotations:
          summary: "{{ $labels.env }}: usuários com tela quebrando"
          description: >
            Erro na máquina do usuário — nenhum outro sinal enxerga isto. Costuma seguir um
            deploy. Ver "Cinetra · Erros e jobs" → "Telas que mais quebram no browser".
        labels:
          severity: aviso
        data:
          - refId: consulta
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: loki
            model:
              refId: consulta
              expr: sum by (env) (count_over_time({env="prod"} |= "erro no browser" [15m]))
              queryType: instant
          - refId: alerta
            datasourceUid: __expr__
            model:
              refId: alerta
              type: threshold
              expression: consulta
              conditions:
                - evaluator: { type: gt, params: [5] }

      - uid: cinetra-job-falhando
        title: Job do Oban falhando
        for: 10m
        condition: alerta
        # `noDataState: OK` e não o padrão. Aqui "sem dado" significa **sem erro** — não há o que
        # alarmar. Com o padrão (`NoData`), toda instalação sem tráfego de `prod` acende um
        # `DatasourceNoData` permanente; medido: quatro alertas falsos ativos em dev, que é
        # exatamente o alarme-que-ninguém-mais-lê que este plano combate.
        noDataState: OK
        annotations:
          summary: "{{ $labels.env }}: jobs estourando"
          description: >
            Job que RODOU e falhou. Job que DEIXOU de rodar não produz linha nenhuma e só o
            heartbeat externo percebe (doc 62 §9) — são alertas diferentes de propósito.
        labels:
          severity: aviso
        data:
          - refId: consulta
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: loki
            model:
              refId: consulta
              expr: sum by (env) (count_over_time({env="prod", service=~".*api.*"} |= "job:exception" [10m]))
              queryType: instant
          - refId: alerta
            datasourceUid: __expr__
            model:
              refId: alerta
              type: threshold
              expression: consulta
              conditions:
                - evaluator: { type: gt, params: [3] }

  # ---- A MÁQUINA (doc 74) ----------------------------------------------------------------------
  #
  # Grupo separado dos de cima por uma diferença de natureza, não de arrumação: os alertas do
  # `cinetra-criticos` leem o LOG e perguntam "o sistema se comportou mal?". Estes leem MÉTRICA e
  # perguntam "o sistema ainda tem onde rodar?" — disco, memória, CPU, teto de container.
  #
  # A ordem de chegada importa numa investigação: quando os dois disparam juntos, é quase sempre
  # este grupo que é a causa e o outro que é o sintoma.
  - orgId: 1
    name: cinetra-maquina
    folder: Cinetra
    interval: 1m
    rules:
      - uid: cinetra-disco-cheio
        title: Disco quase cheio
        # 10 min de `for` porque disco não enche em rajada — enche em rampa. O que este `for`
        # descarta é o pico de um build ou de um dump, não o problema.
        for: 10m
        condition: alerta
        # `Alerting` e NÃO `OK`, ao contrário dos alertas de log. A diferença é o que a ausência
        # significa: log sem linha quer dizer "não houve erro"; métrica de disco sem série quer
        # dizer que o node-exporter morreu — e aí ninguém está mais olhando o disco.
        noDataState: Alerting
        annotations:
          summary: "Disco em {{ humanizePercentage $values.consulta.Value }} em {{ $labels.mountpoint }}"
          description: >
            É o risco que o doc 62 §3 nomeia como o real de pôr log e banco na mesma máquina.
            Disco cheio não degrada: para. O Postgres recusa escrita e o Loki para de ingerir.
            O `mountpoint` está no título — não é preciso adivinhar qual
            partição. Ver "Maiores tabelas" (Infraestrutura) se for o volume do banco.
            Alívio rápido: `docker system prune` e a retenção do Loki (LOKI_DATA).
        labels:
          severity: critico
        data:
          - refId: consulta
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: consulta
              instant: true
              # R-M13 (onda 4). Duas correções numa linha, e as duas eram sérias.
              #
              # **`by (mountpoint)`.** Sem ele o `max()` colapsa todas as partições numa série sem
              # rótulo: o alerta dizia "disco em 91%" e não dizia ONDE. Pior que inconveniente —
              # com o volume limitado do Loki (12 G, que DEVE encher) ao lado da raiz, a partição
              # pequena e cheia **mascarava** a raiz de verdade: o `max` já estava em 100% por
              # causa do loop, e uma raiz subindo de 70% para 95% não mudava o número.
              #
              # **Excluir os volumes contidos.** `/var/lib/cinetra/loki` e `.../tempo` são loop
              # devices ext4 com tamanho fixo (`criar-volume-limitado.sh`), e encher é o
              # MECANISMO de contenção deles funcionando. Alertar CRÍTICO com o texto "o Postgres
              # recusa escrita" quando o banco está intacto é o caminho mais
              # rápido para a equipe aprender a ignorar o alerta que mais importa. Eles têm regra
              # própria logo abaixo, com a severidade certa.
              expr: >-
                max by (mountpoint) (
                  1 - node_filesystem_avail_bytes{fstype=~"ext4|xfs", mountpoint!~"/var/lib/cinetra/.*"}
                      / node_filesystem_size_bytes{fstype=~"ext4|xfs", mountpoint!~"/var/lib/cinetra/.*"}
                )
          - refId: alerta
            datasourceUid: __expr__
            model:
              refId: alerta
              type: threshold
              expression: consulta
              conditions:
                - evaluator: { type: gt, params: [0.85] }

      # A contrapartida da exclusão acima (R-M13). O volume limitado encher é o mecanismo de
      # contenção FUNCIONANDO — mas continuar cheio significa que a retenção não dá conta do
      # volume de log, e aí o Loki começa a recusar ingestão. É `aviso`, não `critico`: nada do
      # produto para, e a ação é ajustar retenção ou aumentar o volume, não correr.
      - uid: cinetra-volume-contido-cheio
        title: Volume limitado de observabilidade cheio
        for: 30m
        condition: alerta
        noDataState: OK
        annotations:
          summary: "{{ $labels.mountpoint }} em {{ humanizePercentage $values.consulta.Value }}"
          description: >
            É o loop device do `criar-volume-limitado.sh`, e ele DEVE encher — é assim que o log
            para de disputar disco com o banco. O que este alerta diz é que ele está cheio há meia
            hora, ou seja: a retenção configurada não cabe no tamanho escolhido, e o Loki passa a
            recusar ingestão. Ajuste a retenção (doc 62) ou aumente o volume. Nada do produto para.
        labels:
          severity: aviso
        data:
          - refId: consulta
            relativeTimeRange: { from: 1800, to: 0 }
            datasourceUid: prometheus
            model:
              refId: consulta
              instant: true
              expr: >-
                max by (mountpoint) (
                  1 - node_filesystem_avail_bytes{mountpoint=~"/var/lib/cinetra/.*"}
                      / node_filesystem_size_bytes{mountpoint=~"/var/lib/cinetra/.*"}
                )
          - refId: alerta
            datasourceUid: __expr__
            model:
              refId: alerta
              type: threshold
              expression: consulta
              conditions:
                - evaluator: { type: gt, params: [0.95] }

      - uid: cinetra-memoria-maquina
        title: Memória da máquina no limite
        for: 15m
        condition: alerta
        noDataState: Alerting
        annotations:
          summary: "Memória da máquina em {{ humanizePercentage $values.consulta.Value }}"
          description: >
            Contra MemAvailable, não MemFree — num servidor saudável MemFree é sempre próximo de
            zero, porque o Linux usa a RAM livre como cache de disco. Passando daqui o kernel
            começa a matar container por OOM, e o primeiro a morrer não é necessariamente o
            culpado. Ver "Cinetra · Servidor" → "Memória por container: % do próprio teto" para
            achar quem cresceu.
        labels:
          severity: critico
        data:
          - refId: consulta
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: prometheus
            model:
              refId: consulta
              instant: true
              expr: 1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes
          - refId: alerta
            datasourceUid: __expr__
            model:
              refId: alerta
              type: threshold
              expression: consulta
              conditions:
                - evaluator: { type: gt, params: [0.90] }

      - uid: cinetra-container-no-teto
        title: Container encostando no próprio teto de memória
        for: 10m
        condition: alerta
        # `OK` aqui, ao contrário dos dois de cima: container que some do cAdvisor pode ter sido
        # parado de propósito, e alarmar todo `docker compose down` treina a equipe a ignorar.
        noDataState: OK
        annotations:
          summary: "{{ $labels.name }} em {{ humanizePercentage $values.consulta.Value }} do mem_limit"
          description: >
            O aviso que chega ANTES do OOM kill. O `mem_limit` por container é a salvaguarda que
            substituiu a segunda VM (doc 62 §3) — este alerta é como se sabe que ela está prestes
            a agir. Container morto por OOM reinicia sozinho e some do log: o rastro fica no
            "Containers agora", na coluna "no ar há".
        labels:
          severity: aviso
        data:
          - refId: consulta
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: consulta
              instant: true
              # O `> 0` no denominador não é enfeite: container SEM `mem_limit` reporta teto zero,
              # a divisão vira `+Inf`, e `+Inf > 0.9` é verdadeiro — o alerta dispararia para todo
              # container sem limite, para sempre, no minuto em que fosse provisionado.
              expr: max by (name) (container_memory_working_set_bytes{name!=""} / (container_spec_memory_limit_bytes{name!=""} > 0))
          - refId: alerta
            datasourceUid: __expr__
            model:
              refId: alerta
              type: threshold
              expression: consulta
              conditions:
                - evaluator: { type: gt, params: [0.90] }

      - uid: cinetra-coleta-de-metrica-parada
        title: Alvo de métrica fora do ar
        # O irmão do `cinetra-pipeline-parado`, para o outro pipeline. Mesma lição, aprendida no
        # log e válida aqui: liveness não detecta ausência de dado. Um painel de CPU vazio é
        # indistinguível de uma CPU ociosa, e sem este alerta a descoberta acontece no incidente
        # seguinte — quando o histórico que se ia consultar não existe.
        for: 10m
        condition: alerta
        noDataState: Alerting
        annotations:
          summary: "{{ $labels.job }} ({{ $labels.instance }}) parou de responder à raspagem"
          description: >
            Enquanto durar, TODO painel que depende deste alvo fica vazio sem dizer por quê — e
            "vazio" lê-se como "tudo calmo". Confira o alvo em
            `deploy/observability/verificar.sh`, e no dashboard "Cinetra · Servidor" o número
            "Alvos raspando" contra o total esperado.
        labels:
          severity: critico
        data:
          - refId: consulta
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: consulta
              instant: true
              # `min by (job, instance)` e NÃO `min(up)`. Medido em produção, 2026-08-06: o e-mail
              # chegou dizendo **"[no value] ([no value]) parou de responder à raspagem"**. A
              # agregação sem `by` colapsa os alvos numa série única e apaga TODOS os rótulos —
              # então o `{{ $labels.job }}` do summary acima nunca teve o que renderizar. O alerta
              # acordava alguém às 3h para dizer que algo caiu, sem dizer o quê: exatamente o
              # oposto do que esta pasta inteira tenta fazer.
              #
              # De brinde, o alerta passa a ser uma instância POR ALVO caído em vez de uma só. O
              # `group_by: ['grafana_folder', 'alertname']` com `singleEmail: true` junta todas
              # num e-mail — a lista dos alvos, não a soma deles.
              #
              # Continua havendo um caminho em que o rótulo vem vazio, e ele é irredutível: se o
              # PRÓPRIO Prometheus estiver inalcançável, a regra dispara por `NoData` (ver
              # `noDataState` acima), e instância de `NoData` não carrega rótulo de consulta.
              expr: min by (job, instance) (up)
          - refId: alerta
            datasourceUid: __expr__
            model:
              refId: alerta
              type: threshold
              expression: consulta
              conditions:
                - evaluator: { type: lt, params: [1] }

  # ---- O QUE JÁ ERA COLETADO E NÃO TINHA QUEM LESSE (R-M15, onda 4) ---------------------------
  #
  # Cinco métricas estavam no `metric_relabel_configs` do `prometheus.yml` — pagas, guardadas, com
  # série de 30 dias — e **nenhuma regra as consultava**. Coletar sem ler é o meio-termo mais caro:
  # tem o custo da coleta e não tem o benefício da detecção.
  #
  # O caso que mais dói é o primeiro. `cinetra-job-falhando` conta linhas `job:exception`, e por
  # isso só enxerga job que ESTOURA. Job que trava sem erro — worker sem slot, agendado que ninguém
  # puxa, ou órfão em `executing` (R-A1) — não gera exceção nenhuma: a fila cresce em silêncio, os
  # lembretes param de sair, e o primeiro sinal é o paciente faltar.
  - orgId: 1
    name: cinetra-silenciosos
    folder: Cinetra
    interval: 1m
    rules:
      - uid: cinetra-fila-do-oban-parada
        title: Fila do Oban crescendo sem exceção
        # 20 min porque a poda da madrugada legitimamente enfileira em rajada. O que interessa é
        # fila que NÃO drena — não fila que teve pico.
        for: 20m
        condition: alerta
        # `OK` e não `Alerting`: sem tráfego não há fila, e uma instalação parada não deve acender.
        noDataState: OK
        annotations:
          summary: "{{ $labels.queue }}: {{ $values.consulta.Value }} jobs parados na fila"
          description: >
            Este é o buraco que o `cinetra-job-falhando` não cobre: ele conta `job:exception`, então
            só vê job que ESTOURA. Job que trava sem erro — worker sem slot, agendado que ninguém
            puxa, ou órfão em `executing` depois de um SIGKILL — não produz exceção alguma. A fila
            cresce calada, o lembrete ao paciente não sai, e o primeiro sinal seria a falta.
            Confira `oban_jobs` por `state` e o `Oban.Plugins.Lifeline` (api/config/config.exs).
        labels:
          severity: aviso
        data:
          - refId: consulta
            relativeTimeRange: { from: 1200, to: 0 }
            datasourceUid: prometheus
            model:
              refId: consulta
              instant: true
              expr: max by (queue) (api_prom_ex_oban_queue_length_count)
          - refId: alerta
            datasourceUid: __expr__
            model:
              refId: alerta
              type: threshold
              expression: consulta
              conditions:
                - evaluator: { type: gt, params: [50] }

      - uid: cinetra-container-morto-por-oom
        title: Container morto por falta de memória
        # Sem `for`: OOM kill é evento, não estado. Esperar persistência aqui seria esperar o
        # container morrer DE NOVO.
        for: 0m
        condition: alerta
        noDataState: OK
        annotations:
          summary: "OOM kill em {{ $labels.name }}"
          description: >
            O kernel matou um container por memória. Com os `mem_limit` da onda 2, isso passou a
            significar "este serviço estourou o PRÓPRIO teto" — e não mais "a máquina acabou".
            Se for o `db` ou o `api`, o teto está apertado demais ou há vazamento; se for o
            cAdvisor, é a regressão do R-M18 (o `.env` rebaixando o teto medido).
        labels:
          severity: critico
        data:
          - refId: consulta
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: consulta
              instant: true
              expr: max by (name) (increase(container_oom_events_total[10m]))
          - refId: alerta
            datasourceUid: __expr__
            model:
              refId: alerta
              type: threshold
              expression: consulta
              conditions:
                - evaluator: { type: gt, params: [0] }

      - uid: cinetra-oom-na-maquina
        title: OOM killer disparou na máquina
        # O irmão do de cima, do lado do host: pega o processo que morreu FORA de container —
        # inclusive o build do release, que mede ~90% de CPU e é o candidato natural (D-21).
        for: 0m
        condition: alerta
        noDataState: OK
        annotations:
          summary: "O kernel matou algum processo por falta de memória"
          description: >
            Diferente do alerta por container: este pega o que morreu FORA de container — o build
            do release é o candidato natural (D-21). Se disparar junto com o de container, a
            máquina inteira está apertada e a soma dos tetos precisa ser revista.
        labels:
          severity: critico
        data:
          - refId: consulta
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: consulta
              instant: true
              expr: increase(node_vmstat_oom_kill[10m])
          - refId: alerta
            datasourceUid: __expr__
            model:
              refId: alerta
              type: threshold
              expression: consulta
              conditions:
                - evaluator: { type: gt, params: [0] }

      - uid: cinetra-container-unhealthy
        title: Container reprovando no próprio healthcheck
        # Só existe porque a onda 2 pôs healthcheck nos containers (R-A7). Antes desta onda o
        # `container_health_state` era coletado e sempre vazio — não havia healthcheck para
        # reportar estado. Coletar métrica de um mecanismo que não existe é a forma mais discreta
        # de parecer coberto.
        for: 5m
        condition: alerta
        noDataState: OK
        annotations:
          summary: "{{ $labels.name }} está unhealthy há 5 minutos"
          description: >
            O processo está vivo e reprovando no próprio teste — event loop bloqueado no Node,
            pool esgotado no BEAM, banco fora do ar para o `db`. O Docker reinicia sozinho quando
            o processo MORRE; unhealthy sustentado é o caso em que ele não morre e ninguém age.
        labels:
          severity: aviso
        data:
          - refId: consulta
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: consulta
              instant: true
              expr: max by (name) (container_health_state{name!=""} == 0)
          - refId: alerta
            datasourceUid: __expr__
            model:
              refId: alerta
              type: threshold
              expression: consulta
              conditions:
                - evaluator: { type: lt, params: [1] }

      - uid: cinetra-disco-somente-leitura
        title: Sistema de arquivos remontado somente-leitura
        for: 0m
        condition: alerta
        noDataState: OK
        annotations:
          summary: "{{ $labels.mountpoint }} está em somente-leitura"
          description: >
            O kernel remonta `ro` diante de erro de I/O — é o sintoma de disco com defeito, e o
            `errors=remount-ro` é o default deste sistema de arquivos. O Postgres para de aceitar
            escrita imediatamente. É o único alerta desta lista em que a ação certa é restaurar
            noutra máquina, não consertar nesta.
        labels:
          severity: critico
        data:
          - refId: consulta
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: consulta
              instant: true
              expr: max by (mountpoint) (node_filesystem_readonly{fstype=~"ext4|xfs"})
          - refId: alerta
            datasourceUid: __expr__
            model:
              refId: alerta
              type: threshold
              expression: consulta
              conditions:
                - evaluator: { type: gt, params: [0] }

      # O motor de alerta vigiando a si mesmo (R-C1, fechando o laço da onda 1). Regra provisionada
      # que o Grafana RECUSOU não existe — e nada diz isso. Um erro de sintaxe no
      # `grafana-alertas.yml` produz exatamente o estado que este arquivo inteiro combate: a
      # sensação de estar coberto, sem cobertura.
      - uid: cinetra-alerta-invalido
        title: Regra de alerta recusada pelo Grafana
        for: 5m
        condition: alerta
        noDataState: OK
        annotations:
          summary: "{{ $values.consulta.Value }} regra(s) de alerta inválida(s)"
          description: >
            O Grafana rejeitou uma regra provisionada. Ela simplesmente NÃO EXISTE — não dispara,
            não aparece como falha, e o painel de alertas fica com um item a menos que ninguém
            conta. Ver o log do container do Grafana no momento do último deploy da observabilidade.
        labels:
          severity: aviso
        data:
          - refId: consulta
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: consulta
              instant: true
              expr: sum(grafana_alerting_alerts_invalid_total)
          - refId: alerta
            datasourceUid: __expr__
            model:
              refId: alerta
              type: threshold
              expression: consulta
              conditions:
                - evaluator: { type: gt, params: [0] }

      # A lacuna que o `cinetra-pipeline-parado` não cobre, e que só agora é observável (o job
      # `alloy` do Prometheus nasceu nesta mesma onda).
      #
      # Aquele alerta dispara quando o total de linhas ZERA por 10 minutos. Descarte PARCIAL — o
      # agente lendo, entregando 60% e jogando 40% fora por rejeição do Loki, limite de taxa ou
      # lote malformado — não zera nada: o painel segue com log chegando, e a fração que sumiu é
      # invisível. O que se perde primeiro, por construção, é a linha da rajada — que é justamente
      # a do incidente.
      - uid: cinetra-log-descartado
        title: Log sendo descartado pelo agente
        for: 10m
        condition: alerta
        # `OK`: sem descarte não há série (registro preguiçoso do Alloy — a família `loki_write_*`
        # só existe depois que a primeira linha flui). "Sem dado" aqui é o estado BOM.
        noDataState: OK
        annotations:
          summary: "{{ $values.consulta.Value }} linhas/s descartadas pelo Alloy"
          description: >
            O agente está LENDO e não conseguindo entregar. Diferente do "pipeline parado": ali o
            total zera e o alerta acende; aqui o log continua chegando pela metade, e a metade que
            some é a da rajada — a do incidente. Causas: Loki recusando por limite de taxa
            (`ingestion_rate_mb` em loki.yml), lote grande demais, ou o Loki fora do ar com o WAL
            do Alloy enchendo. Confira `loki_write_dropped_entries_total` por `reason`.
        labels:
          severity: critico
        data:
          - refId: consulta
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: consulta
              instant: true
              expr: sum(rate(loki_write_dropped_entries_total[10m]))
          - refId: alerta
            datasourceUid: __expr__
            model:
              refId: alerta
              type: threshold
              expression: consulta
              conditions:
                - evaluator: { type: gt, params: [0] }
