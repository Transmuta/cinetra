# Stack de observabilidade — Loki + Grafana + Alloy, **na mesma máquina do app** (doc 62 §3).
#
# ## Por que UMA máquina (revisão de 2026-07-28)
#
# A primeira versão punha Loki/Grafana numa segunda VM, com o argumento de que "observabilidade
# junto com o app fica cega quando o app cai". Revisando, o argumento é mais fraco do que parecia:
#
#   * **Perda total da máquina** — quem avisa é o monitor EXTERNO (doc 62 §9), não o Loki; e os
#     logs de antes do crash já estão no R2, não no disco local. A durabilidade vem do object
#     storage, não da segunda VM.
#   * **Falha de aplicação** (OOM de container, crash loop) — este é o caso real que a separação
#     cobria. E ele se resolve com `mem_limit` por container, abaixo: o Loki não estrangula o
#     Postgres, nem o build do release estrangula o Loki.
#
# O que a segunda VM custava era concreto: outra máquina para provisionar, corrigir e firewallar,
# a divisão do disco de 200 GB em porta de mão única, rede entre VMs — e, medido no mesmo dia,
# duas rodadas de depuração por DNS entre projetos do compose.
#
# Fica **uma VM (4 OCPU / 24 GB)** com tudo, e três salvaguardas que fazem o trabalho que a
# separação faria:
#
#   * `mem_limit` por container — um não estrangula o outro;
#   * teto de DISCO para o Loki (`LOKI_DATA` + `criar-volume-limitado.sh`) — o log não derruba o
#     banco por disco cheio, que é o risco real de dividir a máquina;
#   * monitor EXTERNO — o único que não pode viver aqui dentro.
#
# Os chunks ficam em disco local (decidido 2026-07-28, doc 62 §3.3); o R2 continua sendo um
# `LOKI_OBJECT_STORE=s3` de distância, se um dia a durabilidade passar a importar.
#
# ## O que NÃO volta para dentro
#
# O monitor externo (uptime + heartbeat). É o único componente que precisa viver fora, por um
# motivo que nenhum limite de memória resolve: um vigia hospedado no que ele vigia não manda o
# alerta que importa.
#
# ## Não é um container só
#
# Existe a imagem `grafana/otel-lgtm`, que empacota tudo num container — descartada de propósito:
# a própria documentação dela diz que é para dev/demo, sem persistência nem retenção configuráveis,
# que é justamente o requisito aqui.
#
# Uso:  docker compose -f compose.obs.yml up -d
#       (ou um stack "Compose" no Dokploy apontando para este arquivo)
#
# ATENÇÃO: editou `alloy.alloy`, `loki.yml` ou um dashboard? Use
# `up -d --force-recreate <serviço>`. `restart` não recria o bind mount do arquivo editado.

# Nome de projeto EXPLÍCITO. Containers saem como `cinetra-obs-loki-1`, `cinetra-obs-grafana-1`,
# `cinetra-obs-alloy-1`.
#
# **Precisa ser diferente do projeto da aplicação**, e não por estética: o agente coleta por
# allowlist de projeto do compose (`OBS_PROJETOS`), e é este nome que o mantém fora da própria
# coleta. Se ele casasse com a allowlist, o Loki registraria o Loki registrando o Loki — e o log
# da ferramenta de log consumiria a retenção do produto.
#
# É também a razão de rodar aqui um projeto separado, e não de estarem em máquinas diferentes:
# projeto do compose é agrupamento LÓGICO. Os dois rodam no mesmo servidor; o que a separação
# compra é ciclo de vida próprio — um deploy da aplicação não reinicia a coleta de log.
#
# `OBS_PROJETOS` lista os projetos da APLICAÇÃO, nunca um curinga que engula este aqui.
name: cinetra-obs

# R-A6 (doc 95, onda 2 do doc 102) — rotação de log dos containers desta stack.
#
# A âncora já existia no `compose.dokploy.yml:32-42`, com a justificativa certa (*"o default do
# Docker é `json-file` SEM LIMITE"*), e foi aplicada aos 6 serviços do produto. Aqui, nos 7, não
# havia nenhuma — e é onde dói mais, por dois motivos:
#
#   1. Loki e Tempo estão em `log_level: warn`, mas Prometheus, Grafana, cAdvisor, node-exporter e
#      Alloy logam em `info` sem teto, no MESMO disco do `pgdata`;
#   2. `cinetra-obs` está deliberadamente fora da allowlist de coleta (decisão correta, para o
#      Loki não coletar a si mesmo) — então esses arquivos não são embarcados nem consultáveis.
#      Eles crescem **invisíveis**, e o primeiro sinal seria o disco cheio.
#
# É a ferramenta de disco cheio enchendo o disco: exatamente o risco #5 do doc 59 §10 que o
# `x-logging` do outro arquivo existe para fechar.
x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

services:
  # ---- O CADEADO DO SOCKET DO DOCKER (R-A9, onda 5 do doc 102) --------------------------------
  #
  # O que estava errado, e o comentário do próprio arquivo dizia o contrário: montar
  # `/var/run/docker.sock` com `:ro` **não** reduz privilégio. O `:ro` é do *bind mount* — impede
  # apagar ou substituir o arquivo — e não impede `connect()` seguido de
  # `POST /containers/create`. Um container com o socket montado, `:ro` ou não, cria um container
  # privilegiado com `/` do host dentro. Isso é **root na máquina**, com o `pgdata` de produção ao
  # lado.
  #
  # E eram DOIS containers, não um: o cAdvisor montava `/var/run`, que **contém** o socket. Pelo
  # mesmo motivo, o raciocínio que dispensava `privileged` nele ("privilegiado é estritamente pior
  # que o socket que o alloy já monta — e aquele ao menos é `:ro`") não se sustentava: as duas
  # pontas eram equivalentes.
  #
  # A mitigação real é esta: um proxy que só deixa passar o que cada cliente precisa. `POST=0` é a
  # linha que importa — sem POST não há `create`, `start` nem `exec`, e o caminho de RCE→root
  # fecha. O resto é `GET` de leitura.
  #
  # **Não verificado com o stack de pé** (o `cinetra-obs` não sobe na máquina de desenvolvimento).
  # O risco concreto se algo estiver errado: o Alloy para de descobrir containers (o log some, e o
  # dead man's switch acusa em 10 min) e o cAdvisor perde os rótulos de nome (os painéis de
  # container esvaziam). Ambos são visíveis e reversíveis — o rollback é voltar o bind do socket.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0@sha256:9e4b9e7517a6b660f2cc903a19b257b1852d5b3344794e3ea334ff00ae677ac2
    restart: unless-stopped
    logging: *logging
    mem_limit: ${DOCKER_PROXY_MEM_LIMIT:-64m}
    cpus: ${DOCKER_PROXY_CPUS:-0.25}
    environment:
      # A allowlist. Tudo que não está aqui é 403 no proxy.
      #
      #   CONTAINERS — `/containers/json` (descobrir) e `/containers/*/logs` (ler). É o que o
      #                `loki.source.docker` faz, e o que o cAdvisor precisa para rotular.
      #   EVENTS     — o Alloy acompanha start/stop para não perder container novo.
      #   INFO/VERSION — handshake do cliente Docker; sem eles o cAdvisor nem conecta.
      CONTAINERS: 1
      EVENTS: 1
      INFO: 1
      VERSION: 1
      # **A linha que fecha o buraco.** Sem POST não existe `create`, `start`, `exec` nem `update`
      # — que é exatamente o caminho de "RCE no agente vira root no host".
      POST: 0
      # Explícitos em 0 mesmo sendo o default: aqui o silêncio custa caro demais para depender do
      # default de uma imagem de terceiro que pode mudar de versão.
      EXEC: 0
      IMAGES: 0
      VOLUMES: 0
      NETWORKS: 0
      SECRETS: 0
      CONFIGS: 0
      SERVICES: 0
      TASKS: 0
      SWARM: 0
      NODES: 0
      PLUGINS: 0
      SYSTEM: 0
      AUTH: 0
      BUILD: 0
      COMMIT: 0
      DISTRIBUTION: 0
      SESSION: 0
    volumes:
      # O ÚNICO container que toca o socket. Ele é o perímetro; os outros falam TCP com ele.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # `expose` e nunca `ports`: um proxy de socket publicado no host é o buraco original com uma
    # porta a mais.
    expose:
      - "2375"
    networks:
      - obs
    healthcheck:
      # A imagem é haproxy sobre Alpine e tem `nc`. `/version` é o endpoint mais barato permitido.
      test: ["CMD-SHELL", "nc -z 127.0.0.1 2375"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  loki:
    image: grafana/loki:3.5.7
    # `expand-env` é o que permite um único loki.yml servir dev (filesystem) e produção (R2).
    command: ["-config.file=/etc/loki/loki.yml", "-config.expand-env=true"]
    restart: unless-stopped
    # O limite que substitui a segunda VM. Consulta longa sobre 30 dias é o que mais consome aqui;
    # sem teto ela competiria com o Postgres e com o build do release Elixir na mesma máquina.
    logging: *logging
    mem_limit: ${LOKI_MEM_LIMIT:-1500m}
    # O maior teto de CPU da stack, e é onde o R-M12 morde: uma consulta LogQL de 30 dias
    # descomprime e varre chunks, e ela é aberta DURANTE um incidente — quando o produto mais
    # precisa dos 2 vCPU. 1.0 deixa metade da máquina para o resto; sem teto, o diagnóstico vira
    # a causa.
    cpus: ${LOKI_CPUS:-1.0}
    environment:
      # DECIDIDO: `filesystem` (disco local). O dado mora no volume e morre com a máquina — o que
      # tem valor legal é a trilha de auditoria, que vive no BANCO e entra no snapshot. Trocar
      # para `s3` (R2) é possível, mas NÃO é retroativo: os chunks antigos ficam para trás.
      LOKI_OBJECT_STORE: ${LOKI_OBJECT_STORE:-filesystem}
      LOKI_S3_ENDPOINT: ${LOKI_S3_ENDPOINT:-}
      LOKI_S3_BUCKET: ${LOKI_S3_BUCKET:-}
      LOKI_S3_ACCESS_KEY_ID: ${LOKI_S3_ACCESS_KEY_ID:-}
      LOKI_S3_SECRET_ACCESS_KEY: ${LOKI_S3_SECRET_ACCESS_KEY:-}
    volumes:
      - ./loki.yml:/etc/loki/loki.yml:ro
      # Volume nomeado por padrão. Se `LOKI_DATA` apontar para um CAMINHO, vira bind mount — é
      # assim que se impõe um teto de tamanho ao log: o Loki não tem limite de armazenamento
      # nativo (só retenção por tempo e limite de taxa), então quem impõe é o sistema de arquivos.
      # Ver `criar-volume-limitado.sh` ao lado e doc 62 §3.4.
      - ${LOKI_DATA:-loki_data}:/loki
    # NÃO publica porta. Log agregado é alvo de reconhecimento — rotas, ids, versões, mensagens de
    # erro. Só quem está nesta rede alcança.
    expose:
      - "3100"
    networks:
      - obs
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:3100/ready | grep -q ready"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  grafana:
    image: grafana/grafana:13.1.1
    restart: unless-stopped
    logging: *logging
    mem_limit: ${GRAFANA_MEM_LIMIT:-512m}
    cpus: ${GRAFANA_CPUS:-0.5}
    # R-M16 (onda 2) — era `condition: service_healthy` no Loki, e isso invertia a ordem de quem
    # socorre quem. O Grafana hospeda TODAS as 9 regras de alerta, inclusive as 4 que só leem o
    # Prometheus. Num reboot com o volume do Loki cheio ou com permissão errada (o caso que
    # `criar-volume-limitado.sh:52-55` descreve), o healthcheck do Loki nunca passava, o Grafana
    # NUNCA SUBIA — e sumiam junto os alertas de disco e de memória, que são exatamente os que
    # explicariam o que estava acontecendo. `restart: unless-stopped` não ajudava: o `depends_on`
    # bloqueia a partida.
    #
    # `service_started` mantém a ordem de subida (o datasource do Loki acha o host de primeira) e
    # custa nada quando o Loki está degradado: o painel de log dá erro VISÍVEL e todo o resto do
    # Grafana funciona. O motor de alerta não pode depender de uma das fontes que ele vigia.
    depends_on:
      loki:
        condition: service_started
    healthcheck:
      # `database: ok` e não só HTTP 200: o Grafana responde no `/api/health` antes de conseguir
      # abrir o próprio SQLite, e um painel que sobe sem banco é um painel sem dashboard nenhum.
      # Verificado na imagem 12.3.1 — ela tem wget, curl, nc e bash.
      test: ["CMD-SHELL", "wget -q -O- http://localhost:3000/api/health | grep -q '\"database\": \"ok\"'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    environment:
      # Senha obrigatória via env — sem default. Grafana com admin/admin exposto é como a maioria
      # dos vazamentos de observabilidade começa.
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?defina GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?defina GRAFANA_ADMIN_PASSWORD}
      # `:?` e não `:-`, de propósito (achado A3 do doc 86 §3). Sem esta variável o Grafana usa o
      # `secret_key` do `defaults.ini` — `SW2YcwTIb9zpOOhoPsMm`, publicado na imagem — para assinar
      # o cookie de sessão e cifrar segredo de datasource. Com `:?` o container RECUSA subir sem um
      # valor próprio, o que é backstop mais forte que um teste: o default não tem como vazar porque
      # não sobe. Gere com `openssl rand -hex 32`.
      GF_SECURITY_SECRET_KEY: ${GRAFANA_SECRET_KEY:?defina GRAFANA_SECRET_KEY - openssl rand -hex 32}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # ---- Identidade INDIVIDUAL pelo Cloudflare Access (R-M17, onda 5 do doc 102) -------------
      #
      # **Desligado, e é preparação — não obra em vigor.** O R-M17 descreve "três pessoas dividem
      # uma senha", e essa premissa NÃO vale nesta instalação: o Zero Trust libera o painel para um
      # único e-mail. Com uma pessoa, a atribuição já é inequívoca e a revogação já é individual
      # (tirar o e-mail da política do Access) — o mecanismo que o achado pedia existe, só não é o
      # Grafana que o provê. Ver doc 102 §4.5.1.
      #
      # O que isto compraria no dia do gatilho — a SEGUNDA pessoa com acesso — é um usuário do
      # Grafana por pessoa, no lugar de todos entrarem como `admin`. E vale saber o que **não**
      # compraria: nem com `auth.proxy` o Grafana audita CONSULTA. Ele registra quem abriu a
      # sessão, não qual query rodou no Explore; "quem viu o agregado de todas as clínicas"
      # continua no nível de "quem entrou e quando", que o log do Access já dá.
      #
      # **No dia de ligar, considere `auth.jwt` no lugar disto.** A proteção do `auth.proxy` é
      # POSICIONAL (a allowlist de IP abaixo, que ainda por cima é o IP do Traefik e muda a cada
      # recreate); a do `auth.jwt` é CRIPTOGRÁFICA — valida o `Cf-Access-Jwt-Assertion` contra o
      # JWKS do tenant e o `aud` do app, e a posição de rede deixa de importar. Numa rede
      # compartilhada (ver R-M21, aceito), a segunda é estritamente melhor.
      #
      # ## A armadilha, e ela ficou mais séria com a decisão do 5.2
      #
      # `auth.proxy` faz o Grafana confiar num HEADER. Sem allowlist de origem, qualquer um que
      # alcance o Grafana pela rede pode mandar `Cf-Access-Authenticated-User-Email: quem-eu-quiser`
      # e **entrar como essa pessoa**. E o 5.2 registrou, como decisão consciente, que o Grafana é
      # alcançável na `dokploy-network`, que é compartilhada por todos os stacks da máquina.
      #
      # Ou seja: ligar isto sem a allowlist certa transforma "alcançável lateralmente" em "admin
      # lateral". Por isso o default do `WHITELIST` é `127.0.0.1` — se alguém ligar o proxy sem
      # configurar a origem, o Access deixa de ser aceito e todo mundo cai no formulário de login.
      # **Falha para o lado chato, não para o lado aberto.**
      GF_AUTH_PROXY_ENABLED: ${GRAFANA_AUTH_PROXY:-false}
      GF_AUTH_PROXY_HEADER_NAME: Cf-Access-Authenticated-User-Email
      GF_AUTH_PROXY_HEADER_PROPERTY: email
      # Cria o usuário no primeiro acesso — quem o Access deixou passar já foi autorizado lá, e
      # exigir cadastro manual aqui só produziria "não consigo entrar" no dia do incidente.
      GF_AUTH_PROXY_AUTO_SIGN_UP: "true"
      GF_AUTH_PROXY_WHITELIST: ${GRAFANA_AUTH_PROXY_WHITELIST:-127.0.0.1}
      # O formulário de login continua LIGADO de propósito: é o break-glass. Se o Cloudflare Access
      # cair, ninguém entra no painel — e o painel é justamente o que se abre quando algo caiu.
      # O custo é a senha compartilhada continuar existindo; o que ela deixa de ser é o caminho
      # NORMAL, e o log do Access passa a responder "quem consultou o quê" no dia a dia.
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000}
      # A tela que abre ao entrar (doc 86). Sem isto o Grafana abre a home dele, que lista os
      # treze dashboards em ordem alfabética e não diz por onde começar — e a resposta honesta é
      # que só UM deles deve ser aberto por hábito.
      #
      # É CAMINHO DE ARQUIVO, não UID. O `default_home_dashboard_path` lê o JSON do disco; apontar
      # para `cinetra-dia-a-dia` aqui não dá erro — o Grafana cai calado na home padrão, e a única
      # pista fica numa linha de log que ninguém procura.
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/cinetra/12-dia-a-dia.json
      # SMTP do alerta (doc 62 §11). Sem isto o alerta dispara e fica só na tela — e alerta que
      # ninguém vê é painel, não alerta.
      GF_SMTP_ENABLED: ${GRAFANA_SMTP_ENABLED:-false}
      GF_SMTP_HOST: ${GRAFANA_SMTP_HOST:-}
      GF_SMTP_USER: ${GRAFANA_SMTP_USER:-}
      GF_SMTP_PASSWORD: ${GRAFANA_SMTP_PASSWORD:-}
      GF_SMTP_FROM_ADDRESS: ${GRAFANA_SMTP_FROM:-}
      # Datasource do BANCO (doc 73). O Grafana interpola estas no provisionamento. O usuário só
      # enxerga as views `metrics_*`; ver grafana-datasources.yml.
      METRICS_DB_HOST: ${METRICS_DB_HOST:-db}
      METRICS_DB_PORT: ${METRICS_DB_PORT:-5432}
      METRICS_DB_NAME: ${METRICS_DB_NAME:-cinetra_dev}
      METRICS_DB_USER: ${METRICS_DB_USER:-cinetra_metrics}
      # `:?` e não `:-`, como o do admin acima — e por isso a mesma frase serve: senha de banco com
      # default conhecido é como a maioria dos vazamentos de observabilidade começa. Aqui o default
      # era `cinetra_metrics`, publicado no repositório, e o usuário que ele destrava lê o agregado
      # de TODAS as clínicas (as views `metrics_*` rodam com os direitos do dono e ignoram RLS por
      # construção). Ver bate-volta doc 77 §5.2.
      #
      # O par disto é `priv/sql/setup_metrics_role.sql`, que também deixou de ter senha literal.
      METRICS_DB_PASSWORD: ${METRICS_DB_PASSWORD:?defina METRICS_DB_PASSWORD}
    volumes:
      - ./grafana-datasources.yml:/etc/grafana/provisioning/datasources/loki.yml:ro
      - ./grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/cinetra.yml:ro
      - ./grafana-alertas.yml:/etc/grafana/provisioning/alerting/cinetra.yml:ro
      # Diretório (não arquivo): acrescentar painel não exige mexer no compose, e editar um
      # existente não quebra o mount como acontece com bind mount de arquivo único.
      - ./dashboards:/etc/grafana/provisioning/dashboards/cinetra:ro
      - grafana_data:/var/lib/grafana
    ports:
      # Bind SÓ em 127.0.0.1, nunca em 0.0.0.0 (achado A2 do doc 86 §3: o Grafana era o único
      # serviço com `ports:` e publicava na interface pública). Em produção o painel é alcançado
      # pelo Traefik (`labels` abaixo) + Cloudflare Access; esta porta sobra para um túnel SSH de
      # emergência e para o dev abrir em `localhost:3300`. Publicá-la em 0.0.0.0 exporia o login do
      # Grafana — que, com o datasource do banco, enxerga o agregado de TODAS as clínicas.
      - "127.0.0.1:${GRAFANA_PORT:-3300}:3000"
    # Roteamento do painel em PRODUÇÃO: `obs.<dominio>` atrás do Cloudflare Access (doc 86 §4).
    # Espelham os do `compose.dokploy.yml`: `tls=true` com o Origin Certificate da Cloudflare, sem
    # certresolver (o desafio HTTP-01 não fecha com a 80 trancada nas faixas da CF). INERTES em dev
    # — não há Traefik lendo este stack ali, então os labels não fazem nada.
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.cinetra-obs.rule=Host(`${GRAFANA_HOST:-obs.localhost}`)
      - traefik.http.routers.cinetra-obs.entrypoints=websecure
      - traefik.http.routers.cinetra-obs.tls=true
      - traefik.http.services.cinetra-obs.loadbalancer.server.port=3000
    networks:
      - obs
      # A rede da APLICAÇÃO, para alcançar o Postgres. Só o Grafana entra nela — o Loki e o Alloy
      # não têm o que fazer lá.
      - app
      # A rede do Traefik (`dokploy-network` em produção), por onde o painel é ROTEADO. É a MESMA
      # rede externa que o Prometheus usa para raspar, então herda `METRICS_NETWORK` e não pede
      # variável nova. Em produção é distinta de `app` (cinetra-prod_data vs dokploy-network); em
      # dev as duas colapsam em `cinetra_default` — duas chaves para a mesma rede, o que o Compose
      # aceita (o container conecta uma vez). Sem esta linha o Traefik não tem caminho até o Grafana
      # e `obs.<dominio>` dá 502.
      - edge

  # ---- MÉTRICAS (doc 74) ------------------------------------------------------------------------
  #
  # A terceira fonte. Log responde "o que a aplicação fez", as views `metrics_*` respondem "em que
  # estado o negócio está", e estas três respondem **"em que estado a máquina está"** — a lacuna
  # que o doc 62 §11.2 registrou por escrito e deixou em aberto.
  prometheus:
    image: prom/prometheus:v3.13.1
    restart: unless-stopped
    # Série temporal é barata em disco e cara em memória: o Prometheus mantém os blocos das
    # últimas 2h em RAM. Com ~1.500 séries (medido, ver doc 74 §6) 512m sobra.
    logging: *logging
    mem_limit: ${PROMETHEUS_MEM_LIMIT:-512m}
    cpus: ${PROMETHEUS_CPUS:-0.5}
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # 30 dias, para casar com a retenção do Loki: investigar incidente pulando entre painel de
      # métrica e painel de log só funciona se os dois alcançarem a mesma data.
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}
      # Teto de DISCO — e aqui está a diferença em relação ao Loki, que não tem isso e por isso
      # precisou do `criar-volume-limitado.sh` ao lado. O Prometheus apaga bloco antigo sozinho ao
      # encostar no limite, então basta configurar.
      - --storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-10GB}
      # `--web.enable-admin-api` fica FORA, deliberadamente (bate-volta doc 77 §5.3).
      #
      # Ela habilita `POST /api/v1/admin/tsdb/delete_series`, que apaga série por HTTP sem
      # autenticação nenhuma. O Prometheus é `expose` e não `ports`, então isso não vem da
      # internet — mas vem de QUALQUER container na rede `obs`, e o custo do pior caso é perder o
      # histórico de métrica justamente durante o incidente em que ele seria lido.
      #
      # O que se perde: apagar uma série com label errado pela UI do Grafana. O contorno é recriar
      # o volume do Prometheus (`docker volume rm`), que em métrica é barato — dado de série
      # temporal é reconstituído pela raspagem seguinte, ao contrário de log e trace. Trocar uma
      # capacidade destrutiva permanente por um comando manual raro é a troca certa.
      #
      # Para religar em uma investigação pontual, acrescente a flag e derrube o container depois.
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # A lista de alvos da API, separada da configuração porque é a ÚNICA coisa que muda entre
      # dev e produção — o Prometheus não expande variável de ambiente no `prometheus.yml` (ver o
      # cabeçalho dele), e um arquivo editado à mão no deploy faz o diff do PR mentir sobre o que
      # roda em produção.
      #
      # Produção: `PROMETHEUS_TARGETS=./targets/api-prod.yml`, que lista os dois stacks com um
      # `env` cada.
      - ${PROMETHEUS_TARGETS:-./targets/api-dev.yml}:/etc/prometheus/targets/api.yml:ro
      - prometheus_data:/prometheus
    # NÃO publica porta, pelo mesmo motivo do Loki: a lista de alvos, os nomes de fila e o volume
    # de requisição por rota são reconhecimento pronto para quem estiver olhando.
    expose:
      - "9090"
    networks:
      - obs
      # Rede PRÓPRIA, e não a `app` que o Grafana usa — em produção as duas divergem, e a razão é
      # concreta:
      #
      #   * o Grafana precisa alcançar o **Postgres**, que só existe na rede `data` de cada stack;
      #   * o Prometheus precisa alcançar a **API** dos DOIS stacks, e o `api` está em
      #     `dokploy-network`, que é externa e compartilhada pela máquina inteira.
      #
      # Com uma variável só, escolher `data` deixaria o HML sem métrica e escolher
      # `dokploy-network` deixaria o Grafana sem banco. Em dev as duas apontam para
      # `cinetra_default` e nada disso aparece — que é justamente por que precisa estar escrito.
      - app_metrics
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:9090/-/healthy | grep -q Healthy"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # A MÁQUINA: CPU, load, memória, swap, disco, rede.
  #
  # Roda com `pid: host` e com o sistema de arquivos do host montado SOMENTE LEITURA. Precisa
  # mesmo: dentro do próprio namespace ele mediria o container, e o container tem um `/proc` que
  # enxerga um processo só — os números sairiam plausíveis e errados, que é o pior resultado
  # possível para um painel de capacidade.
  node-exporter:
    image: prom/node-exporter:v1.12.1
    restart: unless-stopped
    logging: *logging
    mem_limit: ${NODE_EXPORTER_MEM_LIMIT:-128m}
    cpus: ${NODE_EXPORTER_CPUS:-0.25}
    healthcheck:
      # O node-exporter não tem endpoint de saúde — `/` é uma landing page HTML que responde 200
      # mesmo com o coletor quebrado. A asserção útil é sobre o próprio `/metrics`: se
      # `node_exporter_build_info` está lá, o handler serviu de verdade. Verificado no container em
      # execução: 3 linhas casam. A imagem tem `wget` (busybox).
      test: ["CMD-SHELL", "wget -q -O- http://localhost:9100/metrics | grep -q node_exporter_build_info"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    pid: host
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/host/root
      # Sem esta exclusão, cada camada de imagem do Docker vira um "sistema de arquivos" no painel
      # de disco — dezenas de linhas de overlay que empurram para fora a única que importa, a do
      # volume onde o Postgres escreve.
      #
      # As três últimas alternativas são ruído de Docker Desktop no WSL2, medido em dev: 58 das 97
      # séries de sistema de arquivos eram bind mount interno da ferramenta. Não existem na VM
      # Linux de produção, e por isso não custam nada ali — ficam para que o painel seja legível
      # nas duas máquinas.
      #
      # `mnt/host/wsl` e `run/desktop` são DOIS conjuntos, com os mesmos diretórios montados duas
      # vezes por caminhos diferentes. Filtrar só um deixa o outro, e a contagem cai pela metade
      # em vez de zerar — foi exatamente o que aconteceu ao medir (97 → 45 → 39).
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run/credentials/.+|var/lib/docker/.+|host/root/var/lib/docker/.+|mnt/host/wsl/.+|run/desktop/.+|parent-distro/.+)($$|/)
      # `tmpfs` e `9p` entram na lista junto com os pseudo-sistemas. tmpfs é RAM, e já está
      # contabilizada nos painéis de memória — deixá-la aqui faria "disco em 90%" significar
      # coisas diferentes em linhas vizinhas do mesmo painel. 9p é o compartilhamento com o
      # Windows, que não é disco do servidor.
      - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fuse\..*|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tmpfs|tracefs|9p)$$
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      # `rslave` é o PADRÃO porque é a opção CORRETA num servidor Linux, e o modo de falhar sem
      # ela é o pior que existe: partição separada (o volume de dados, por exemplo) não propaga
      # para dentro do container, o coletor stata o caminho e recebe os números do sistema de
      # arquivos PAI. O painel desenha um disco plausível, com a ocupação errada, e ninguém
      # desconfia até o disco encher.
      #
      # Em Docker Desktop / WSL2 o `/` não é montagem compartilhada e o compose recusa subir com
      # uma mensagem explícita ("path / is mounted on / but it is not a shared or slave mount").
      # Ali, e só ali, ponha no `.env.local`:
      #
      #     NODE_EXPORTER_ROOTFS=/:/host/root:ro
      #
      # Perde-se a visão de partição separada — o que numa máquina de desenvolvimento não muda
      # nada, porque o disco é um só. Falha ALTA em vez de número errado, que é a troca certa.
      - ${NODE_EXPORTER_ROOTFS:-/:/host/root:ro,rslave}
    expose:
      - "9100"
    networks:
      - obs

  # OS CONTAINERS: CPU e memória por container, e o contador de reinícios.
  #
  # Responde o que o node exporter não responde — "a memória subiu, mas de QUEM?". E como cada
  # serviço aqui tem `mem_limit`, o cAdvisor expõe `container_spec_memory_limit_bytes`: dá para
  # desenhar uso CONTRA o teto, que é a curva que antecede o OOM kill.
  #
  # ## Sobre `privileged`
  #
  # A documentação do cAdvisor manda rodar privilegiado. Aqui ele roda **sem**, com montagens
  # somente-leitura, porque privilegiado é estritamente pior que o socket do Docker que o
  # `alloy` já monta — e aquele ao menos é `:ro`. O que se perde sem privilégio são coletores de
  # borda (perf events, resctrl); CPU, memória, rede e I/O por container saem normalmente.
  #
  # Se um dia um painel ficar vazio por falta de privilégio, a decisão de conceder é HUMANA e vem
  # com justificativa no doc 74 — não é para ser ligada silenciosamente por quem estiver
  # depurando.
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    restart: unless-stopped
    # 512m, e o número tem história: com 384m o working set medido ficou em **337 MiB (87,8% do
    # teto)** — a um passo do OOM kill. Quem achou foi o painel "Memória por container: % do
    # próprio teto" desta mesma entrega, no primeiro dia em que existiu.
    #
    # Só aumentar o teto seria tratar o sintoma; as quatro opções abaixo cortam o consumo na
    # origem. O teto maior é a margem, não o remédio.
    logging: *logging
    mem_limit: ${CADVISOR_MEM_LIMIT:-512m}
    cpus: ${CADVISOR_CPUS:-0.5}
    depends_on:
      docker-proxy:
        condition: service_healthy
    healthcheck:
      # `/healthz` devolve exatamente `ok` — verificado no container em execução. A imagem tem
      # `wget` em `/usr/bin/wget`.
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8080/healthz | grep -q ok"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    command:
      # Só containers do Docker. Sem isto ele reporta TODO cgroup da máquina, incluindo os do
      # systemd — centenas de séries que ninguém vai olhar, num Prometheus que tem teto de disco.
      - --docker_only=true
      # Guarda 1 min de amostra em memória em vez do padrão. O Prometheus raspa a cada 15 s; o
      # resto é RAM parada.
      - --storage_duration=1m
      # O padrão do cAdvisor é recolher estatística de CADA container a cada **1 segundo**. O
      # Prometheus raspa a cada 15 s, então 14 de cada 15 amostras eram calculadas, guardadas e
      # descartadas sem nunca serem lidas.
      - --housekeeping_interval=15s
      - --max_housekeeping_interval=60s
      # Histórico de eventos (OOM, criação, parada) em memória. Quem guarda linha do tempo neste
      # projeto é o Loki, com 30 dias e busca — não um buffer que morre com o container.
      - --event_storage_event_limit=default=0
      - --event_storage_age_limit=default=0
      # Os labels do compose (projeto, serviço, working-dir, caminho do arquivo…) viravam LABEL
      # DE MÉTRICA em toda série. É custo dobrado: memória aqui e cardinalidade no Prometheus,
      # para um dado que o nome do container já carrega.
      - --store_container_labels=false
      # Os coletores caros e de alta cardinalidade, desligados. `network` fica.
      #
      # `disk` e `diskIO` entraram na lista em 2026-07-29 (doc 86) depois de medidos: eles rendiam
      # `container_fs_*`, ~1.500 das 7.567 séries do Prometheus — uma por container × dispositivo,
      # 21 nomes de métrica, e NENHUM painel jamais abriu um deles. Pior que o volume era o
      # trabalho: o cAdvisor varria estatística de cgroup de bloco a cada 15 s para ninguém ler.
      #
      # Desligar aqui é diferente de podar no `prometheus.yml`: aqui o dado não é CALCULADO. A
      # `metric_relabel_configs` do job `cadvisor` também lista `container_fs_*` fora, e a
      # duplicação é deliberada — é a rede para quem mexer neste flag sem passar por lá.
      #
      # A troca: perde-se disco POR CONTAINER. A pergunta que importa — "o disco vai encher?" — é
      # respondida pelo `node_filesystem_*`, que mede a partição de verdade; e para saber de quem é
      # o volume, `docker system df -v` responde na hora, sem custar série temporal para sempre.
      # R-A9 (onda 5). Sem isto o cAdvisor procura o socket em `/var/run/docker.sock` — que não
      # está mais montado — e perde os RÓTULOS de nome de container: as métricas continuam vindo,
      # com id de cgroup no lugar do nome, e todo painel por container esvazia sem dar erro.
      - --docker=${DOCKER_HOST_OBS:-tcp://docker-proxy:2375}
      - --disable_metrics=advtcp,cpu_topology,cpuset,disk,diskIO,hugetlb,memory_numa,percpu,process,referenced_memory,resctrl,sched,tcp,udp
    volumes:
      - /:/rootfs:ro
      # R-A9 (onda 5): `- /var/run:/var/run:ro` saiu daqui, e ele era a metade **não registrada** do
      # achado — `/var/run` CONTÉM o `docker.sock`, então este container também era
      # root-equivalente. O cAdvisor agora fala TCP com o `docker-proxy` (ver `--docker=` no
      # `command`), que só permite GET de container.
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      # `/dev/kmsg` é o que evita o aviso de boot e permite o coletor de OOM. É um device de
      # LEITURA do log do kernel — não dá controle sobre a máquina, ao contrário de `privileged`.
      - /dev/kmsg:/dev/kmsg:r
    expose:
      - "8080"
    networks:
      - obs

  # ---- TRACES (doc 76) --------------------------------------------------------------------------
  #
  # O sinal que faltava, e o único que responde "onde foi o tempo DESTA requisição" atravessando o
  # BFF e a API. Log e métrica dizem que a tela demorou 3 s; só o trace diz que 2,8 s foram numa
  # consulta do Ecto disparada duas vezes.
  #
  # Recebe SÓ do Alloy (ver `tempo.yml`): é lá que a redação mora, e um segundo caminho de entrada
  # seria um caminho sem redação.
  tempo:
    image: grafana/tempo:2.10.7
    # `expand-env` pelo mesmo motivo do Loki: um arquivo serve dev e produção, e a retenção vira
    # variável de ambiente em vez de fork do arquivo.
    command: ["-config.file=/etc/tempo/tempo.yml", "-config.expand-env=true"]
    restart: unless-stopped
    # Trace é rajada: o ingester segura os blocos abertos em memória até fechar (5 min, ver
    # tempo.yml). 512m cobre o volume do doc 62 §2 com folga larga; o que estoura primeiro num
    # laço de instrumentação é o teto de trace do `overrides`, não este.
    logging: *logging
    mem_limit: ${TEMPO_MEM_LIMIT:-512m}
    cpus: ${TEMPO_CPUS:-0.5}
    volumes:
      - ./tempo.yml:/etc/tempo/tempo.yml:ro
      # Mesmo padrão do Loki: volume nomeado por default, e um CAMINHO em `TEMPO_DATA` transforma
      # em bind mount — que é como se impõe teto de disco, porque o Tempo também não tem limite de
      # armazenamento nativo (só retenção por tempo). Ver `criar-volume-limitado.sh` ao lado.
      - ${TEMPO_DATA:-tempo_data}:/var/tempo
    environment:
      TEMPO_RETENTION: ${TEMPO_RETENTION:-168h}
    # NÃO publica porta, pelo mesmo motivo do Loki e do Prometheus — e aqui o motivo é mais forte:
    # um trace carrega a rota com id, a consulta SQL e a sequência de chamadas. É o sinal mais
    # detalhado que a máquina produz.
    expose:
      - "3200"
      - "4317"
    networks:
      - obs
    # SEM healthcheck, e não por esquecimento: a imagem do Tempo é **distroless** — não tem
    # `/bin/sh` nem `wget`, então todo `test:` falha com "no such file or directory" e o container
    # fica `unhealthy` para sempre com o serviço funcionando perfeitamente.
    #
    # Medido aqui: o healthcheck copiado do Loki (que é busybox e tem os dois) deixou o Tempo
    # eternamente unhealthy e, por tabela, **impediu o Alloy de subir** — o `depends_on` esperava
    # uma saúde que nunca ia chegar. Ou seja, a coleta de LOG parou por causa do healthcheck do
    # trace. Por isso o `depends_on` abaixo é `service_started`.
    #
    # A prontidão é verificada de fora, por quem tem cliente HTTP: `verificar.sh` §12.

  alloy:
    image: grafana/alloy:v1.12.1
    restart: unless-stopped
    logging: *logging
    # Subiu de 256m junto com o receptor OTLP: o `otelcol.processor.batch` segura lotes de span em
    # memória antes de despachar, o que o caminho de log (que escreve direto) não fazia.
    mem_limit: ${ALLOY_MEM_LIMIT:-384m}
    cpus: ${ALLOY_CPUS:-0.5}
    healthcheck:
      # A imagem do Alloy **não tem wget nem curl** — verificado: só `sh` e `bash`. Por isso o
      # `CMD` com `bash` explícito (o `CMD-SHELL` usaria `/bin/sh`, que é dash e não tem
      # `/dev/tcp`) e a requisição HTTP escrita à mão no socket.
      #
      # `/-/ready` responde `Alloy is ready.` — verificado subindo a imagem com config vazia. Vale
      # mais que checar a porta: o agente aceita conexão antes de ter carregado o pipeline.
      test:
        - CMD
        - bash
        - -c
        - "exec 3<>/dev/tcp/127.0.0.1/12345 && printf 'GET /-/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q 'Alloy is ready' <&3"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      docker-proxy:
        # `service_healthy` aqui e não `service_started`: sem o proxy de pé o agente não descobre
        # container nenhum, e o sintoma seria "log sumiu" — não "o proxy não subiu".
        condition: service_healthy
      loki:
        # **Extensão declarada do R-M16**, que o plano (doc 102, item 2.8) recortou só para o
        # Grafana. Aqui era `service_healthy`, e o mecanismo é o mesmo: num reboot com o volume do
        # Loki cheio, o agente nunca subia — e junto com o log parava a coleta de **trace**, que
        # não tem nada a ver com o Loki. O custo de afrouxar é zero: o `loki.write` tem WAL e
        # reenvia, então um Loki que demora a ficar são atrasa a entrega em vez de matar o agente.
        # É o mesmo argumento que o bloco do `tempo` logo abaixo já fazia.
        condition: service_started
      tempo:
        # `service_started`, não `service_healthy` — mesmo motivo do Loki acima. E a espera frouxa
        # custa pouco: o exportador OTLP reconecta sozinho, então um Tempo que demora a aceitar
        # conexão atrasa os primeiros spans em vez de derrubar o agente.
        condition: service_started
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    environment:
      # R-A9 (onda 5). O agente deixou de falar com o socket e passou a falar TCP com o
      # `docker-proxy`, que recusa POST. Variável em vez de literal para que o rollback seja uma
      # linha no `.env.local` (`unix:///var/run/docker.sock`) mais o bind de volta — sem editar
      # `alloy.alloy` no meio de um incidente.
      DOCKER_HOST_OBS: ${DOCKER_HOST_OBS:-tcp://docker-proxy:2375}
      OBS_ENV: ${OBS_ENV:-dev}
      # Mesma rede do compose: o nome do serviço resolve direto. Foi ao separar os arquivos que
      # isto quebrou — cada stack criou sua rede, o agente parou de resolver `loki`, e nada avisou.
      LOKI_PUSH_URL: ${LOKI_PUSH_URL:-http://loki:3100/loki/api/v1/push}
      # Allowlist de projetos do compose a coletar (regex, ancorado). Obrigatória: o agente lê o
      # daemon do Docker, então SEM ela ele recolhe todo container da máquina — inclusive de outro
      # projeto e o próprio stack de observabilidade. Ver o comentário no alloy.alloy.
      OBS_PROJETOS: "${OBS_PROJETOS:?defina OBS_PROJETOS - ex. cinetra, ou cinetra-prod|cinetra-hml}"
      # Para onde os spans recebidos são despachados (doc 76). Mesma rede do compose: o nome do
      # serviço resolve direto.
      TEMPO_OTLP_ENDPOINT: ${TEMPO_OTLP_ENDPOINT:-tempo:4317}
    volumes:
      - ./alloy.alloy:/etc/alloy/config.alloy:ro
      # R-A9 (onda 5): o bind do socket saiu daqui. Ele foi para o `docker-proxy`, que é agora o
      # único container que o toca — e que só deixa passar GET de container e de evento.
      #
      # O comentário que estava nesta linha afirmava que o `:ro` reduzia privilégio. **Não
      # reduzia**: `:ro` é do bind mount, não da API do Docker. Ver o bloco `docker-proxy`.
      - alloy_data:/var/lib/alloy/data
    # Porta OTLP para os APPS empurrarem span (doc 76). `expose`, nunca `ports`: quem manda trace
    # está na rede do Docker, e um receptor OTLP publicado na internet é ingestão anônima aberta —
    # o Alloy não autentica.
    expose:
      - "4317"
      - "4318"
    networks:
      - obs
      # A rede da APLICAÇÃO por onde os SPANS chegam. Aqui a direção se inverte em relação ao log:
      # log o agente vai BUSCAR no socket do Docker; span o app EMPURRA, então o app precisa
      # alcançar o agente pelo nome. Sem esta linha o `alloy` não resolve de dentro do stack da
      # aplicação e a instrumentação falha calada — o SDK enfileira, tenta, desiste, e a aplicação
      # segue perfeita sem trace.
      #
      # É uma rede DIFERENTE da do Grafana, e isso importa em produção: o Grafana precisa da rede
      # onde está o Postgres (`data`), e o **web não entra nela** de propósito (só a API fala com
      # o banco). Quem tem os dois serviços é a rede `app`. Ligar o agente em `data` deixaria o
      # BFF sem caminho para o agente — e o sintoma seria metade do trace faltando, não um erro.
      - app_otlp

volumes:
  loki_data:
  grafana_data:
  alloy_data:
  # Ao contrário do Loki, este NÃO precisa do truque do volume limitado: o Prometheus tem teto de
  # tamanho nativo (`--storage.tsdb.retention.size`, acima) e poda sozinho ao encostar nele.
  prometheus_data:
  # Este precisa: o Tempo tem retenção por TEMPO e nenhum teto de tamanho, igual ao Loki. Em
  # produção aponte `TEMPO_DATA` para um ponto de montagem de tamanho fixo.
  tempo_data:

networks:
  obs:
    driver: bridge

  # Rede da APLICAÇÃO, criada pelo compose dela — aqui só se entra, não se cria (`external`).
  # Em dev é `cinetra_default`; em produção, a rede `data` do stack, que sai como
  # `<projeto>_data` (ex.: `cinetra-prod_data`).
  #
  # ATENÇÃO — nome errado aqui NÃO degrada, IMPEDE o stack de subir: o compose valida rede externa
  # antes de criar qualquer container, e junto com o Grafana ficariam de fora o Loki e o Alloy, ou
  # seja a coleta de log inteira por causa de um painel. Confira com `docker network ls` antes do
  # primeiro deploy. É falha alta e imediata, não silenciosa — mas é no deploy que ela aparece.
  app:
    external: true
    name: ${APP_NETWORK:-cinetra_default}

  # A rede por onde os SPANS entram (doc 76). Em dev é a mesma de cima — um stack, uma rede. Em
  # PRODUÇÃO são diferentes, e confundi-las custa metade do trace:
  #
  #   * `APP_NETWORK`      = rede do BANCO  (`<projeto>_data`) — é onde o Grafana precisa estar;
  #   * `APP_NETWORK_OTLP` = rede API↔WEB   (`<projeto>_app`)  — é a única com os DOIS serviços.
  #
  # O web não entra na rede do banco de propósito (só a API fala com o Postgres), então o agente
  # ligado só ali receberia span da API e nunca do BFF.
  app_otlp:
    external: true
    name: ${APP_NETWORK_OTLP:-${APP_NETWORK:-cinetra_default}}

  # A rede por onde o Prometheus RASPA a API (doc 74). Separada da `app` de cima porque em
  # produção elas divergem:
  #
  #   | serviço    | precisa alcançar        | mora em            | rede em produção      |
  #   | ---------- | ----------------------- | ------------------ | --------------------- |
  #   | Grafana    | Postgres (views)        | rede `data`        | `cinetra-prod_data`   |
  #   | Prometheus | `/metrics` dos dois api | `dokploy-network`  | `dokploy-network`     |
  #
  # `dokploy-network` é EXTERNA e compartilhada por todos os stacks da máquina, e o serviço `api`
  # está nela (ver `networks: [data, app, dokploy-network]` em `compose.dokploy.yml`). É o que
  # permite um Prometheus só raspar produção E homologação, em vez de entrar na rede `data` de
  # cada stack.
  #
  # Em DEV as duas apontam para `cinetra_default`. Duas chaves de rede com o mesmo nome externo são
  # válidas: cada CONTAINER se conecta uma vez só — o Grafana pela chave `app`, o Prometheus pela
  # `app_metrics`. O que seria erro é o mesmo container listar as duas.
  app_metrics:
    external: true
    name: ${METRICS_NETWORK:-${APP_NETWORK:-cinetra_default}}

  # A rede do Traefik (edge), por onde o painel do Grafana é roteado para `obs.<dominio>`. É a MESMA
  # rede externa por onde o Prometheus raspa a API (`dokploy-network`) — o Traefik e as duas apis
  # vivem nela —, então herda `METRICS_NETWORK` e não exige variável nova. Em dev cai em
  # `cinetra_default` e os labels do Traefik ficam inertes.
  edge:
    external: true
    name: ${METRICS_NETWORK:-${APP_NETWORK:-cinetra_default}}
