# Stack de logs (doc 62 §3 e §4).
#
# Sobe em DOIS lugares diferentes, e a divisão é o ponto central do desenho:
#
#   * `loki` + `grafana`  →  na VM **obs** (1 OCPU / 6 GB), separada da aplicação;
#   * `alloy`             →  na VM **app**, porque é lá que estão os containers a ler.
#
# ## Por que não tudo junto com a aplicação
#
# Observabilidade que roda ao lado do app fica cega exatamente quando é necessária: OOM, disco
# cheio, crash loop, daemon do Docker travado — os modos de falha mais prováveis de uma máquina
# que já hospeda prod + HML + Postgres + Traefik. A segunda VM não protege contra a região inteira
# cair, e não precisa: esse caso é da camada externa (doc 62 §9), que vive fora da OCI.
#
# ## Não é um container só
#
# Existe a imagem `grafana/otel-lgtm`, que empacota tudo num container — descartada de propósito:
# a própria documentação dela diz que é para dev/demo, sem persistência nem retenção configuráveis,
# que é justamente o requisito aqui.
#
# Uso:
#   VM obs:  docker compose -f compose.obs.yml --profile obs up -d
#   VM app:  docker compose -f compose.obs.yml --profile agente up -d

services:
  loki:
    profiles: ["obs"]
    image: grafana/loki:3.5.7
    # `expand-env` é o que permite um único loki.yml servir dev (filesystem) e produção (R2).
    command: ["-config.file=/etc/loki/loki.yml", "-config.expand-env=true"]
    restart: unless-stopped
    environment:
      # Sem estas, cai em `filesystem` e o dado mora no volume — bom para dev, ruim para uma VM
      # descartável. Em produção aponte para o bucket de LOGS (nunca o dos pacientes).
      LOKI_OBJECT_STORE: ${LOKI_OBJECT_STORE:-filesystem}
      LOKI_S3_ENDPOINT: ${LOKI_S3_ENDPOINT:-}
      LOKI_S3_BUCKET: ${LOKI_S3_BUCKET:-}
      LOKI_S3_ACCESS_KEY_ID: ${LOKI_S3_ACCESS_KEY_ID:-}
      LOKI_S3_SECRET_ACCESS_KEY: ${LOKI_S3_SECRET_ACCESS_KEY:-}
    volumes:
      - ./loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    # NÃO publica porta para a internet. Log agregado é alvo de reconhecimento — rotas, ids,
    # versões, mensagens de erro. Só a rede interna alcança.
    expose:
      - "3100"
    networks:
      - obs
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:3100/ready | grep -q ready"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  grafana:
    profiles: ["obs"]
    image: grafana/grafana:12.3.1
    restart: unless-stopped
    depends_on:
      loki:
        condition: service_healthy
    environment:
      # Senha obrigatória via env — sem default. Grafana com admin/admin exposto é como a maioria
      # dos vazamentos de observabilidade começa.
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?defina GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?defina GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      # O Grafana serve a UI; quem termina TLS é o Traefik/túnel à frente.
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000}
    volumes:
      - ./grafana-datasources.yml:/etc/grafana/provisioning/datasources/loki.yml:ro
      - grafana_data:/var/lib/grafana
    ports:
      # Em produção, prefira NÃO publicar e alcançar por VPN. Se publicar, ponha atrás do Traefik
      # com TLS — nunca direto.
      - "${GRAFANA_PORT:-3000}:3000"
    networks:
      - obs

  alloy:
    profiles: ["agente"]
    image: grafana/alloy:v1.12.1
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    environment:
      OBS_ENV: ${OBS_ENV:-dev}
      LOKI_PUSH_URL: ${LOKI_PUSH_URL:?defina LOKI_PUSH_URL}
      # Allowlist de projetos do compose a coletar (regex, ancorado). Obrigatória: o agente lê o
      # daemon do Docker, então SEM ela ele recolhe todo container da máquina — inclusive de
      # outro projeto e o próprio stack de observabilidade. Ver o comentário no alloy.alloy.
      OBS_PROJETOS: "${OBS_PROJETOS:?defina OBS_PROJETOS - ex. moving, ou movimento-prod|movimento-hml}"
    volumes:
      - ./alloy.alloy:/etc/alloy/config.alloy:ro
      # Somente leitura no socket do Docker. O agente precisa LER os logs; não precisa criar,
      # parar nem inspecionar segredo de container nenhum. Socket do Docker montado com escrita é
      # equivalente a root na máquina.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
    networks:
      - obs

volumes:
  loki_data:
  grafana_data:
  alloy_data:

networks:
  obs:
    # Em produção as duas VMs se falam pela rede privada da VCN, e esta rede é só a ponte local
    # entre loki e grafana.
    driver: bridge
