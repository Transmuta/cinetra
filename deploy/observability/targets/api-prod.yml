# Alvos do `/metrics` da API em PRODUÇÃO (doc 74).
#
# Ative montando este arquivo no lugar do de dev — no `.env` do stack de observabilidade:
#
#     PROMETHEUS_TARGETS=./targets/api-prod.yml
#     METRICS_NETWORK=dokploy-network
#
# ## Por que ALIAS de stack, e não nome de serviço nem nome de container
#
# Na VM de produção há DOIS stacks do compose, cada um com um serviço chamado `api`. O nome do
# serviço é ambíguo entre eles. A primeira versão deste arquivo desambiguava pelo NOME DO CONTAINER
# (`cinetra-prod-api-1`), mas ele é frágil: muda com o nome do projeto no Dokploy e com o índice de
# réplica (`-1`, `-2`). Desde `compose.dokploy.yml`, cada api publica um alias ÚNICO na
# `dokploy-network` — `api-${STACK}`, ou seja `api-prod` e `api-hml` — criado justamente para
# desambiguar os dois stacks (o web usa o mesmo alias em `API_URL`). É o nome estável para mirar
# aqui: não depende do nome do projeto nem do índice do container.
#
# Nome errado aqui não derruba nada: o alvo fica `DOWN`, os painéis da aplicação ficam vazios, e
# vazio lê-se como "tudo calmo". O alerta `cinetra-coleta-de-metrica-parada` existe para esse caso,
# e o painel "Alvos raspando" mostra o número contra o total esperado. Confira antes do 1º deploy,
# de dentro do container do Prometheus (é ele quem resolve o alias, não o host):
#
#     docker exec cinetra-obs-prometheus-1 getent hosts api-prod api-hml
#
# ## Por que DOIS grupos, e não um com dois alvos
#
# Cada grupo carrega seus próprios `labels`. Um grupo só com os dois alvos daria o mesmo `env` aos
# dois — e as séries de produção e homologação cairiam na mesma linha do painel, fazendo um teste
# de carga no HML parecer pico de produção.
#
# ## A rede
#
# Os dois containers da API estão em `dokploy-network`, que é EXTERNA e compartilhada por todos os
# stacks da máquina (ver `networks:` em `compose.dokploy.yml`). É por isso que um Prometheus só
# alcança os dois — sem ela, seria preciso entrar na rede `data` de cada stack, uma por uma.

- targets:
    - api-prod:4021
  labels:
    env: prod

- targets:
    - api-hml:4021
  labels:
    env: hml
